const PAGES = {"index":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Sourcing & Tender System Docs<\/title>\n<style>/* Shared look: white background, big readable font, clear colors */\n@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');\n\n:root {\n  --bg: #ffffff;\n  --ink: #0f172a;\n  --muted: #475569;\n  --line: #e2e8f0;\n  --soft: #f8fafc;\n  --brand: #be185d;\n  --brand-soft: #fdf2f8;\n  --blue: #1d4ed8;\n  --radius: 18px;\n  --mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;\n}\n\n* { box-sizing: border-box; }\nhtml { font-size: 20px; }\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;\n  line-height: 1.6;\n}\na { color: var(--blue); }\nh1 { font-size: 2.4rem; line-height: 1.15; margin: 0 0 .4rem; font-weight: 800; letter-spacing: -.02em; }\nh2 { font-size: 1.6rem; margin: 2rem 0 .6rem; font-weight: 800; }\nh3 { font-size: 1.2rem; margin: 1.2rem 0 .4rem; font-weight: 700; }\np  { margin: .4rem 0 1rem; }\ncode, pre { font-family: var(--mono); }\n.muted { color: var(--muted); }\n\n/* ---------- top navigation ---------- */\n.topnav {\n  position: sticky; top: 0; z-index: 50;\n  background: #fff; border-bottom: 2px solid var(--line);\n  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;\n  padding: .6rem 1.5rem;\n}\n.topnav .brand { font-weight: 800; font-size: 1.1rem; color: var(--brand); text-decoration: none; margin-right: 1rem; }\n.topnav a.link {\n  text-decoration: none; color: var(--ink); font-weight: 600; font-size: .85rem;\n  padding: .35rem .8rem; border-radius: 999px;\n}\n.topnav a.link:hover { background: var(--soft); }\n.topnav a.link.active { background: var(--brand); color: #fff; }\n\n.wrap { max-width: 1500px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }\n.pagehead { padding: 1.5rem 0 .5rem; }\n.pagehead p { color: var(--muted); max-width: 70ch; font-size: 1rem; }\n\nfooter.site { border-top: 2px solid var(--line); padding: 1.2rem 1.5rem; color: var(--muted); font-size: .8rem; text-align: center; }\n\n/* ---------- cards / badges / buttons ---------- */\n.grid { display: grid; gap: 1.1rem; }\n.cards { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }\n.card {\n  border: 2px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.3rem; background: #fff;\n}\na.card { text-decoration: none; color: inherit; transition: .15s; display: block; }\na.card:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(15,23,42,.08); }\n.card h3 { margin-top: 0; }\n.badge {\n  display: inline-block; padding: .05rem .6rem; border-radius: 999px;\n  font-size: .7rem; font-weight: 700; letter-spacing: .02em; color: #fff; background: var(--muted);\n}\n.badge.pk { background: #ca8a04; }\n.badge.fk { background: #2563eb; }\n.badge.uq { background: #7c3aed; }\n.badge.null { background: #94a3b8; }\n.btn {\n  font: inherit; font-weight: 700; font-size: .85rem; cursor: pointer;\n  border: 2px solid var(--ink); background: #fff; color: var(--ink);\n  padding: .45rem 1.1rem; border-radius: 12px;\n}\n.btn:hover { background: var(--soft); }\n.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }\n.btn.primary:hover { filter: brightness(1.08); }\n.btn:disabled { opacity: .4; cursor: not-allowed; }\n\n.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: .8rem 0; }\n.chip {\n  font: inherit; font-size: .8rem; font-weight: 700; cursor: pointer;\n  border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: .25rem .9rem;\n}\n.chip.on { color: #fff; border-color: transparent; }\n\ntable.simple { border-collapse: collapse; width: 100%; font-size: .85rem; }\ntable.simple th, table.simple td { text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }\ntable.simple th { background: var(--soft); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }\n<\/style>\n<style>\n  .hero { padding: 2.5rem 0 1rem; }\n  .hero h1 { font-size: 3rem; }\n  .hero p { font-size: 1.15rem; color: var(--muted); max-width: 62ch; }\n  .tile h3 { font-size: 1.3rem; }\n  .tile p { color: var(--muted); font-size: .9rem; margin: .2rem 0 0; }\n  .bar { height: 8px; border-radius: 99px; margin-bottom: .9rem; }\n  .stats { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1.5rem 0; }\n  .stat { border: 2px solid var(--line); border-radius: 18px; padding: .8rem 1.4rem; min-width: 170px; }\n  .stat b { display: block; font-size: 2rem; line-height: 1.1; color: var(--brand); }\n  .stat span { color: var(--muted); font-size: .8rem; font-weight: 600; }\n<\/style>\n<style>.topnav,footer.site{display:none!important}#panel{top:16px!important;max-height:calc(100vh - 32px)!important}<\/style><!--SUB--><\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"hero\">\n    <h1>Sourcing &amp; Tender Management System<\/h1>\n    <p>Team guide for our cosmetics company: how the database is designed, how a request travels from idea to awarded supplier, and which pages each role uses.<\/p>\n  <\/div>\n\n  <div class=\"stats\">\n    <div class=\"stat\"><b id=\"n-tables\">0<\/b><span>Tables<\/span><\/div>\n    <div class=\"stat\"><b id=\"n-rel\">0<\/b><span>Relations<\/span><\/div>\n    <div class=\"stat\"><b id=\"n-roles\">7<\/b><span>Roles<\/span><\/div>\n    <div class=\"stat\"><b id=\"n-cycles\">0<\/b><span>Story cycles<\/span><\/div>\n  <\/div>\n\n  <div class=\"grid cards\">\n    <a class=\"card tile\" href=\"schema.html\"><div class=\"bar\" style=\"background:#1d4ed8\"><\/div><h3>Schema Diagram<\/h3><p>Click a table to see what it depends on and who uses it.<\/p><\/a>\n    <a class=\"card tile\" href=\"er.html\"><div class=\"bar\" style=\"background:#15803d\"><\/div><h3>ER Diagram<\/h3><p>Entities, relationships and 1 / N cardinality by subject area.<\/p><\/a>\n    <a class=\"card tile\" href=\"sql.html\"><div class=\"bar\" style=\"background:#7e22ce\"><\/div><h3>SQL Script<\/h3><p>Full SQL Server script with search, copy and download.<\/p><\/a>\n    <a class=\"card tile\" href=\"flow.html\"><div class=\"bar\" style=\"background:#be185d\"><\/div><h3>Flow Story<\/h3><p>Step by step: nodes, arrows, request contents and what happens in each phase.<\/p><\/a>\n    <a class=\"card tile\" href=\"pages.html\"><div class=\"bar\" style=\"background:#c2410c\"><\/div><h3>Pages &amp; Roles<\/h3><p>Every page, its features, and the cycle it belongs to.<\/p><\/a>\n    <a class=\"card tile\" href=\"onboarding.html\"><div class=\"bar\" style=\"background:#0f766e\"><\/div><h3>Onboarding Data<\/h3><p>What each user fills in, including fingerprint and face.<\/p><\/a>\n  <\/div>\n\n  <h2>Four mandatory features<\/h2>\n  <div class=\"grid cards\">\n    <div class=\"card\"><h3>1. Face + fingerprint<\/h3><p>Both are required for employees. Fingerprint uses WebAuthn passkeys. Face uses a camera with a liveness check.<\/p><\/div>\n    <div class=\"card\"><h3>2. AI bid analysis<\/h3><p>Ollama reads bid JSON and returns extracted data, strengths, weaknesses and an initial recommendation.<\/p><\/div>\n    <div class=\"card\"><h3>3. Voice search<\/h3><p>Speech-to-text search on the employee dashboard task list.<\/p><\/div>\n    <div class=\"card\"><h3>4. Clarifications<\/h3><p>Role-based questions and answers linked to requests, tenders and bids.<\/p><\/div>\n  <\/div>\n<\/div>\n<script>/*\n  Single source of truth for the database design.\n  Schema page, ER page and SQL page all read from here.\n\n  Column mini-format:  \"Name type FLAGS...\"\n    PK        primary key (two PK columns = composite key)\n    UQ        unique\n    NULL      nullable (everything else is NOT NULL)\n    FK>Table  foreign key to Table.Id\n    CK:A|B_C  CHECK constraint with allowed values (\"_\" = space)\n    DEF:xxx   default value\n    ~verb_x   relationship name used in the ER diagram\n*/\n(function (root) {\n  const domains = {\n    identity:  { label: 'Users & Identity',        color: '#1d4ed8' },\n    biometric: { label: 'Biometrics (required)',   color: '#be185d' },\n    request:   { label: 'Purchase Requests',       color: '#c2410c' },\n    tender:    { label: 'Tenders',                 color: '#15803d' },\n    bid:       { label: 'Supplier Bids',           color: '#7e22ce' },\n    eval:      { label: 'Evaluation & Decisions',  color: '#0f766e' },\n    collab:    { label: 'Communication & Audit',   color: '#b45309' },\n  };\n\n  const raw = [\n    // ───────────── Users & Identity ─────────────\n    ['Departments', 'identity', 'Company departments such as Production, Packaging, R&D, Marketing, Finance.', [\n      'Id int PK', 'Name nvarchar(100) UQ', 'Code nvarchar(20) UQ', 'IsActive bit',\n    ]],\n    ['AspNetUsers', 'identity', 'Every login account (employees and suppliers). Managed by ASP.NET Core Identity plus our own columns.', [\n      'Id nvarchar(450) PK', 'UserName nvarchar(256)', 'NormalizedUserName nvarchar(256) UQ',\n      'Email nvarchar(256) UQ', 'NormalizedEmail nvarchar(256)', 'EmailConfirmed bit',\n      'PasswordHash nvarchar(max) NULL', 'SecurityStamp nvarchar(max) NULL', 'ConcurrencyStamp nvarchar(max) NULL',\n      'PhoneNumber nvarchar(30) NULL', 'TwoFactorEnabled bit', 'LockoutEnd datetimeoffset NULL',\n      'LockoutEnabled bit DEF:1', 'AccessFailedCount int',\n      'FullName nvarchar(150)', 'UserType nvarchar(20) CK:Employee|Supplier',\n      'DepartmentId int FK>Departments NULL ~works_in', 'JobTitle nvarchar(100) NULL',\n      'IsActive bit', 'MustChangePassword bit',\n      'OnboardingStatus nvarchar(30) CK:NotStarted|InProgress|Completed DEF:\\'NotStarted\\'',\n      'BiometricConsentAt datetime2 NULL', 'CreatedAt datetime2', 'LastLoginAt datetime2 NULL',\n    ]],\n    ['AspNetRoles', 'identity', 'Roles: Admin, Requester, SourcingOfficer, EvaluationCommittee, SourcingManager, TopCommittee, Supplier.', [\n      'Id nvarchar(450) PK', 'Name nvarchar(256) UQ', 'NormalizedName nvarchar(256)', 'ConcurrencyStamp nvarchar(max) NULL',\n    ]],\n    ['AspNetUserRoles', 'identity', 'Links users to roles (many-to-many).', [\n      'UserId nvarchar(450) PK FK>AspNetUsers ~has_role', 'RoleId nvarchar(450) PK FK>AspNetRoles ~assigned_to',\n    ]],\n    ['EmployeeProfiles', 'identity', 'Extra data every employee fills during onboarding.', [\n      'Id int PK', 'UserId nvarchar(450) UQ FK>AspNetUsers ~has_profile', 'EmployeeNumber nvarchar(30) UQ',\n      'HireDate date', 'WorkPhone nvarchar(30)', 'PreferredLanguage nvarchar(10) DEF:\\'en\\'',\n      'ProfilePhotoPath nvarchar(300) NULL', 'SignaturePath nvarchar(300) NULL',\n      'OnboardingCompletedAt datetime2 NULL',\n    ]],\n    ['SupplierProfiles', 'identity', 'Supplier company details and Admin verification status.', [\n      'Id int PK', 'UserId nvarchar(450) UQ FK>AspNetUsers ~owns_company',\n      'CompanyName nvarchar(200)', 'TaxNumber nvarchar(50) UQ', 'CommercialRegNumber nvarchar(50)',\n      'Country nvarchar(80)', 'City nvarchar(80)', 'Address nvarchar(300)',\n      'ContactPerson nvarchar(150)', 'ContactPhone nvarchar(30)', 'Website nvarchar(200) NULL',\n      'Category nvarchar(100)', 'Status nvarchar(20) CK:Pending|Approved|Rejected|Suspended DEF:\\'Pending\\'',\n      'StatusReason nvarchar(500) NULL', 'ReviewedByUserId nvarchar(450) FK>AspNetUsers NULL ~reviewed_by',\n      'ReviewedAt datetime2 NULL', 'CreatedAt datetime2',\n    ]],\n    ['SupplierDocuments', 'identity', 'Legal files uploaded by a supplier (license, tax certificate, commercial register).', [\n      'Id int PK', 'SupplierProfileId int FK>SupplierProfiles ~uploads', 'DocType nvarchar(50)',\n      'FilePath nvarchar(300)', 'ExpiryDate date NULL', 'UploadedAt datetime2',\n    ]],\n\n    // ───────────── Biometrics ─────────────\n    ['BiometricCredentials', 'biometric', 'FINGERPRINT (and device unlock). One row per registered WebAuthn passkey. Only the PUBLIC key is stored.', [\n      'Id int PK', 'UserId nvarchar(450) FK>AspNetUsers ~registers', 'CredentialId varbinary(900) UQ',\n      'PublicKey varbinary(max)', 'SignCount bigint', 'DeviceName nvarchar(100)',\n      'AuthenticatorType nvarchar(30) CK:platform|cross-platform', 'Transports nvarchar(100) NULL',\n      'CreatedAt datetime2', 'LastUsedAt datetime2 NULL', 'IsRevoked bit',\n    ]],\n    ['FaceEnrollments', 'biometric', 'FACE. Stores an encrypted face template (numeric vector), never the photo.', [\n      'Id int PK', 'UserId nvarchar(450) FK>AspNetUsers ~enrolls_face', 'FaceTemplate varbinary(max)',\n      'ModelVersion nvarchar(50)', 'LivenessScore decimal(5,4)', 'CreatedAt datetime2',\n      'UpdatedAt datetime2 NULL', 'IsActive bit DEF:1',\n    ]],\n    ['BiometricAuthLogs', 'biometric', 'Every login attempt (face, fingerprint, password) with result, for security and audit.', [\n      'Id bigint PK', 'UserId nvarchar(450) FK>AspNetUsers NULL ~attempted_by',\n      'Method nvarchar(20) CK:Face|Fingerprint|Password', 'Success bit', 'FailureReason nvarchar(200) NULL',\n      'IpAddress nvarchar(45)', 'UserAgent nvarchar(300) NULL', 'CreatedAt datetime2',\n    ]],\n\n    // ───────────── Purchase Requests ─────────────\n    ['PurchaseRequisitions', 'request', 'A purchase request created by a department.', [\n      'Id int PK', 'RequestNumber nvarchar(30) UQ', 'Title nvarchar(200)', 'Reason nvarchar(1000)',\n      'Priority nvarchar(10) CK:Low|Medium|High|Urgent', 'TargetDate date',\n      'Status nvarchar(30) CK:Draft|Submitted|Under_Review|Approved|Rejected|Returned|Converted_to_Tender DEF:\\'Draft\\'',\n      'DepartmentId int FK>Departments ~raised_by', 'RequestedByUserId nvarchar(450) FK>AspNetUsers ~created_by',\n      'ReviewedByUserId nvarchar(450) FK>AspNetUsers NULL ~reviewed_by', 'ReviewNote nvarchar(1000) NULL',\n      'EstimatedBudget decimal(18,2) NULL', 'CreatedAt datetime2', 'SubmittedAt datetime2 NULL',\n    ]],\n    ['PurchaseRequisitionItems', 'request', 'The lines of a request: item, quantity, specification.', [\n      'Id int PK', 'RequisitionId int FK>PurchaseRequisitions ~contains', 'ItemName nvarchar(200)',\n      'Quantity decimal(18,2)', 'Unit nvarchar(30)', 'Specifications nvarchar(max)',\n    ]],\n\n    // ───────────── Tenders ─────────────\n    ['Tenders', 'tender', 'A tender created from an approved request.', [\n      'Id int PK', 'TenderNumber nvarchar(30) UQ', 'RequisitionId int FK>PurchaseRequisitions ~created_from',\n      'Title nvarchar(200)', 'Description nvarchar(max)', 'Terms nvarchar(max)',\n      'Status nvarchar(40) CK:Draft|Published|Open|Closed|Under_Evaluation|Awaiting_Manager_Review|Awaiting_Committee_Decision|Awarded|Cancelled DEF:\\'Draft\\'',\n      'PublishDate datetime2 NULL', 'SubmissionDeadline datetime2', 'EstimatedValue decimal(18,2)',\n      'RequiresTopCommittee bit', 'CreatedByUserId nvarchar(450) FK>AspNetUsers ~managed_by',\n      'AwardedSupplierId int FK>SupplierProfiles NULL ~awarded_to', 'CreatedAt datetime2',\n    ]],\n    ['TenderSuppliers', 'tender', 'Which suppliers were selected for a tender (many-to-many).', [\n      'TenderId int PK FK>Tenders ~includes', 'SupplierProfileId int PK FK>SupplierProfiles ~is_selected_in',\n      'AddedAt datetime2', 'ParticipationStatus nvarchar(20) CK:Selected|Participating|Withdrawn DEF:\\'Selected\\'',\n    ]],\n    ['Invitations', 'tender', 'The invitation sent to a supplier and the supplier\\'s answer.', [\n      'Id int PK', 'TenderId int FK>Tenders ~sends', 'SupplierProfileId int FK>SupplierProfiles ~receives',\n      'Status nvarchar(20) CK:Pending|Accepted|Declined|Expired DEF:\\'Pending\\'',\n      'SentAt datetime2', 'ExpiresAt datetime2', 'RespondedAt datetime2 NULL', 'DeclineReason nvarchar(500) NULL',\n    ]],\n    ['EvaluationCriteria', 'tender', 'Scoring criteria and weights. Locked before bids are opened.', [\n      'Id int PK', 'TenderId int FK>Tenders ~defines', 'Name nvarchar(150)',\n      'Type nvarchar(20) CK:Technical|Financial', 'WeightPercent decimal(5,2)', 'MaxScore int', 'IsLocked bit',\n    ]],\n    ['CommitteeMembers', 'tender', 'The 4 evaluation committee members of a tender.', [\n      'Id int PK', 'TenderId int FK>Tenders ~has_committee', 'UserId nvarchar(450) FK>AspNetUsers ~serves_on',\n      'MemberRole nvarchar(30) CK:SourcingManager|Department|Financial|Technical',\n    ]],\n\n    // ───────────── Bids ─────────────\n    ['Bids', 'bid', 'One supplier offer for one tender.', [\n      'Id int PK', 'TenderId int FK>Tenders ~receives', 'SupplierProfileId int FK>SupplierProfiles ~submits',\n      'Status nvarchar(20) CK:Draft|Submitted|Under_Review|Compliant|Non-Compliant|Accepted|Rejected|Withdrawn DEF:\\'Draft\\'',\n      'TotalPrice decimal(18,2)', 'Currency nvarchar(3)', 'DeliveryDays int', 'ValidityDays int',\n      'PaymentTerms nvarchar(300)', 'TechnicalSummary nvarchar(max)', 'SubmittedAt datetime2 NULL',\n    ]],\n    ['BidItems', 'bid', 'Itemized prices inside a bid.', [\n      'Id int PK', 'BidId int FK>Bids ~itemizes', 'RequisitionItemId int FK>PurchaseRequisitionItems ~prices',\n      'UnitPrice decimal(18,2)', 'Quantity decimal(18,2)', 'TaxAmount decimal(18,2)',\n      'ShippingCost decimal(18,2)', 'InstallationCost decimal(18,2) NULL', 'OfferedSpecifications nvarchar(max)',\n    ]],\n    ['BidDocuments', 'bid', 'Files attached to a bid (datasheets, images, videos, samples).', [\n      'Id int PK', 'BidId int FK>Bids ~attaches', 'DocType nvarchar(50)', 'FileName nvarchar(255)',\n      'FilePath nvarchar(300)', 'ContentType nvarchar(100)', 'SizeBytes bigint', 'UploadedAt datetime2',\n    ]],\n    ['ComplianceChecks', 'bid', 'Mandatory-requirement check result for a bid.', [\n      'Id int PK', 'BidId int FK>Bids ~is_checked_by', 'CheckedByUserId nvarchar(450) FK>AspNetUsers ~performs',\n      'Result nvarchar(30) CK:Compliant|Non-Compliant|Pending_Clarification', 'Reason nvarchar(1000) NULL', 'CheckedAt datetime2',\n    ]],\n\n    // ───────────── Evaluation & Decisions ─────────────\n    ['TechnicalEvaluations', 'eval', 'Technical score per bid and per criterion.', [\n      'Id int PK', 'BidId int FK>Bids ~scored_in', 'CriterionId int FK>EvaluationCriteria ~uses',\n      'EvaluatorUserId nvarchar(450) FK>AspNetUsers ~scores', 'Score decimal(5,2)', 'Notes nvarchar(1000) NULL', 'EvaluatedAt datetime2',\n    ]],\n    ['FinancialEvaluations', 'eval', 'Financial analysis of a bid (total cost, taxes, logistics).', [\n      'Id int PK', 'BidId int FK>Bids ~analysed_in', 'EvaluatorUserId nvarchar(450) FK>AspNetUsers ~analyses',\n      'Score decimal(5,2)', 'TotalCost decimal(18,2)', 'TaxesAndFees decimal(18,2)', 'LogisticsCost decimal(18,2)',\n      'Notes nvarchar(1000) NULL', 'EvaluatedAt datetime2',\n    ]],\n    ['AiBidAnalyses', 'eval', 'Ollama output. Request and response JSON are stored as text (no MongoDB needed).', [\n      'Id int PK', 'BidId int FK>Bids ~analysed_by_ai', 'TenderId int FK>Tenders ~ai_for',\n      'Model nvarchar(100)', 'RequestJson nvarchar(max)', 'ResponseJson nvarchar(max)',\n      'ExtractedPrice decimal(18,2) NULL', 'ExtractedDeliveryDays int NULL', 'MissingFiles nvarchar(max) NULL',\n      'Strengths nvarchar(max) NULL', 'Weaknesses nvarchar(max) NULL', 'AiRecommendation nvarchar(max) NULL',\n      'RequestedByUserId nvarchar(450) FK>AspNetUsers ~requested_by', 'CreatedAt datetime2',\n    ]],\n    ['EvaluationReports', 'eval', 'The ONE unified report with the committee recommendation.', [\n      'Id int PK', 'TenderId int FK>Tenders ~summarised_in',\n      'Status nvarchar(30) CK:Recommendation_Pending|Manager_Approved|Manager_Rejected|Returned_for_Review|Committee_Approved|Committee_Rejected DEF:\\'Recommendation_Pending\\'',\n      'RecommendedBidId int FK>Bids NULL ~recommends', 'TechnicalSummary nvarchar(max)', 'FinancialSummary nvarchar(max)',\n      'Justification nvarchar(max)', 'PreparedByUserId nvarchar(450) FK>AspNetUsers ~prepared_by',\n      'CreatedAt datetime2', 'SubmittedAt datetime2 NULL',\n    ]],\n    ['TenderApprovals', 'eval', 'Manager and Top Committee decisions with comments.', [\n      'Id int PK', 'TenderId int FK>Tenders ~is_decided_in', 'ReportId int FK>EvaluationReports ~decides_on',\n      'DecidedByUserId nvarchar(450) FK>AspNetUsers ~decides', 'Level nvarchar(20) CK:Manager|TopCommittee',\n      'Decision nvarchar(20) CK:Approved|Rejected|Returned', 'SelectedBidId int FK>Bids NULL ~selects',\n      'Comment nvarchar(1000)', 'SignatureHash nvarchar(200) NULL', 'DecidedAt datetime2',\n    ]],\n    ['TopCommitteeVotes', 'eval', 'Each Top Committee member\\'s vote (group decision record).', [\n      'Id int PK', 'TenderId int FK>Tenders ~is_voted_in', 'MemberUserId nvarchar(450) FK>AspNetUsers ~casts',\n      'SelectedBidId int FK>Bids NULL ~votes_for', 'Vote nvarchar(20) CK:Approve|Reject|NeedMoreInfo',\n      'Comment nvarchar(1000) NULL', 'VotedAt datetime2',\n    ]],\n\n    // ───────────── Communication & Audit ─────────────\n    ['Clarifications', 'collab', 'A question between two allowed roles, linked to a request, tender or bid.', [\n      'Id int PK', 'Subject nvarchar(200)', 'Description nvarchar(2000)',\n      'Status nvarchar(20) CK:Pending|Answered|Resolved DEF:\\'Pending\\'',\n      'SenderUserId nvarchar(450) FK>AspNetUsers ~asks', 'ReceiverUserId nvarchar(450) FK>AspNetUsers ~answers',\n      'RequisitionId int FK>PurchaseRequisitions NULL ~about_request', 'TenderId int FK>Tenders NULL ~about_tender',\n      'BidId int FK>Bids NULL ~about_bid', 'CreatedAt datetime2', 'ResolvedAt datetime2 NULL',\n    ]],\n    ['ClarificationMessages', 'collab', 'The replies and follow-ups inside a clarification thread.', [\n      'Id int PK', 'ClarificationId int FK>Clarifications ~has_messages', 'SenderUserId nvarchar(450) FK>AspNetUsers ~writes',\n      'Body nvarchar(20 const t of tables)\n    for (const c of t.cols)\n      if (c.fk) relations.push({\n        child: t.name, childCol: c.name, parent: c.fk, parentCol: 'Id',\n        oneToOne: c.uq, nullable: c.nullable, verb: c.verb || 'references',\n      });\n\n  const api = { domains, tables, byName, relations };\n  if (typeof module !== 'undefined') module.exports = api; else root.DB = api;\n})(typeof window !== 'undefined' ? window : globalThis);\n<\/script>\n<script>/*\n  Story data for the Flow page.\n  Each cycle = actors (nodes) + steps (arrows).\n  A step says: who sends what to whom, what is inside the request, what happens, and what changes in the database.\n*/\nwindow.FLOW = (function () {\n  const actors = {\n    admin:     { name: 'Admin',                      color: '#1d4ed8' },\n    employee:  { name: 'Employee',                   color: '#be185d' },\n    requester: { name: 'Requesting Dept (Sara)',     color: '#c2410c' },\n    officer:   { name: 'Sourcing Officer (Omar)',    color: '#15803d' },\n    supplier:  { name: 'Supplier (BottlePro)',       color: '#7e22ce' },\n    committee: { name: 'Evaluation Committee',       color: '#0f766e' },\n    manager:   { name: 'Sourcing Manager (Nour)',    color: '#b45309' },\n    top:       { name: 'Top Committee',              color: '#be123c' },\n    user:      { name: 'User',                       color: '#be185d' },\n    web:       { name: 'Web App (ASP.NET MVC)',      color: '#0f172a' },\n    db:        { name: 'SQL Server',                 color: '#166534' },\n    device:    { name: 'Device (fingerprint / camera)', color: '#db2777' },\n    ai:        { name: 'Ollama AI',                  color: '#6d28d9' },\n    mail:      { name: 'Notifications / Email',      color: '#a16207' },\n  };\n\n  const s = (from, to, label, payload, what, db, status) => ({ from, to, label, payload, what, db, status });\n\n  const cycles = [\n    // ───────────────────────── 0. BIG PICTURE ─────────────────────────\n    {\n      id: 'big', title: 'Big picture',\n      story: 'Lumière Cosmetics needs 50,000 airless pump bottles for a new serum. Follow the request from the first idea to the awarded supplier.',\n      actors: ['requester', 'officer', 'supplier', 'committee', 'manager', 'top'],\n      steps: [\n        s('requester', 'officer', 'Purchase Request', { title: '50,000 airless pump bottles 30ml', priority: 'High', targetDate: '2026-12-15' },\n          'Sara from Packaging describes the need: what, how many, why and by when.', 'PurchaseRequisitions + Items', 'Request: Draft → Submitted'),\n        s('officer', 'requester', 'Review result', { decision: 'Approved', note: 'Specs are clear' },\n          'Omar checks the request. He can approve, return it for changes, or reject it.', 'PurchaseRequisitions.Status', 'Request: Submitted → Approved'),\n        s('officer', 'supplier', 'Tender invitation', { tender: 'TND-2026-014', deadline: '2026-11-30', criteria: 'Technical 60% / Financial 40%' },\n          'Omar turns the request into a tender, locks the scoring criteria, and invites approved suppliers.', 'Tenders, EvaluationCriteria, Invitations', 'Tender: Draft → Published · Invitation: Pending'),\n        s('supplier', 'officer', 'Accept + submit bid', { totalPrice: 91500, currency: 'USD', deliveryDays: 35, files: ['datasheet.pdf', 'sample.jpg'] },\n          'BottlePro accepts, then submits a price, delivery time and documents before the deadline. Other suppliers cannot see it.', 'Invitations, Bids, BidItems, BidDocuments', 'Invitation: Accepted · Bid: Submitted'),\n        s('officer', 'committee', 'Compliant bids', { compliant: 3, nonCompliant: 1, pendingClarification: 1 },\n          'Omar checks the mandatory documents. The tender closes at the deadline and the evaluation committee receives the compliant bids.', 'ComplianceChecks', 'Tender: Closed → Under Evaluation'),\n        s('committee', 'manager', 'Unified report', { recommendedBid: 'BottlePro', technicalScore: 86, financialScore: 91, justi eria', null),\n        s('officer', 'web', 'POST /Sourcing/Tenders/Suppliers', { tenderId: 14, supplierIds: [12, 17, 23, 31] }, 'Only suppliers with status Approved can be selected.', 'TenderSuppliers', null),\n        s('officer', 'web', 'POST /Sourcing/Tenders/Publish/14', { tenderId: 14 }, 'Criteria are locked and invitations are created.', 'Tenders.Status, Invitations, EvaluationCriteria.IsLocked', 'Tender: Draft → Published · Invitations: Pending'),\n        s('web', 'mail', 'Send invitations', { recipients: 4, subject: 'You are invited: TND-2026-014' }, 'Each supplier gets an in-app notification and an email.', 'Notifications', null),\n        s('supplier', 'web', 'POST /Supplier/Invitations/Respond', { invitationId: 88, response: 'Accepted' }, 'Accept or decline. After the expiry date an unanswered invitation becomes Expired.', 'Invitations.Status', 'Invitation: Pending → Accepted'),\n      ],\n    },\n\n    // ───────────────────────── 6. BID ─────────────────────────\n    {\n      id: 'bid', title: 'Supplier bid',\n      story: 'BottlePro prepares its offer. The system makes sure no supplier can ever see another supplier\\'s bid.',\n      actors: ['supplier', 'web', 'db', 'officer', 'mail'],\n      steps: [\n        s('supplier', 'web', 'GET /Supplier/Tenders/14', {}, 'The supplier sees only tenders it was invited to. A different supplier would get 404.', 'Invitations (read)', null),\n        s('supplier', 'web', 'POST /Supplier/Offers/SaveDraft', { tenderId: 14, items: [{ requisitionItemId: 101, unitPrice: 1.75, tax: 0.12, shipping: 0.05 }], deliveryDays: 35, validityDays: 60, paymentTerms: '30% advance' },\n          'Drafts can be saved and edited many times.', 'Bids, BidItems', 'Bid: Draft'),\n        s('supplier', 'web', 'POST /Supplier/Offers/Upload', { bidId: 301, files: ['datasheet.pdf', 'sample.jpg', 'iso.pdf'] },\n          'Secure upload: allowed types only, size limit, random file name, stored outside the public web folder.', 'BidDocuments', null),\n        s('supplier', 'web', 'POST /Supplier/Offers/Submit', { bidId: 301 },\n          'The server checks: invitation accepted, deadline not passed, required fields and documents present.', 'Bids.Status, Bids.SubmittedAt, AuditLogs', 'Bid: Draft → Submitted'),\n        s('web', 'officer', 'Notify officer', { type: 'BidReceived', tender: 'TND-2026-014' }, 'Omar sees the counter go up, but bids stay sealed until the deadline.', 'Notifications', null),\n        s('web', 'db', 'Deadline job', { now: '2026-11-30 17:00:01' }, 'A background job closes the tender automatically at the deadline. Late submissions are rejected.', 'Tenders.Status', 'Tender: Open → Closed'),\n      ],\n    },\n\n    // ───────────────────────── 7. COMPLIANCE + AI ─────────────────────────\n    {\n      id: 'compliance', title: 'Compliance & AI analysis',\n      story: 'After the deadline Omar checks mandatory documents, then asks Ollama for a first analysis of each bid.',\n      actors: ['officer', 'web', 'db', 'ai', 'committee'],\n      steps: [\n        s('officer', 'web', 'GET /Sourcing/Offers/Compare/14', {}, 'Side-by-side table: price, delivery, specs, documents.', 'Bids, BidItems (read)', null),\n        s('officer', 'web', 'POST /Sourcing/Compliance/Check', { bidId: 301, result: 'Compliant' },\n          'Compliant, Non-Compliant (reason required) or Pending Clarification.', 'ComplianceChecks, Bids.Status', 'Bid: Submitted → Compliant'),\n        s('officer', 'web', 'POST /Sourcing/Ai/Analyze', { tenderId: 14, bidIds: [301, 302, 303] }, 'The officer presses \"Analyze with AI\".', null, null),\n        s('web', 'ai', 'POST :11434/api/generate', { model: 'llama3', format: 'json', prompt: 'Extract price, specs, delivery, missing files. Compare bids. Return JSON.', bids: '[bid data as JSON]' },\n          'The web app sends the bid data as JSON to the local Ollama server. Nothing leaves the company.', null, null),\n        s('ai', 'web', 'JSON answer', { price: 91500, deliveryDays: 35, missingFiles: ['ISO certificate'], strengths: ['Lowest price'], weaknesses: ['No sample'], recommendation: 'BottlePro' },\n          'The model replies with structured JSON.', null, null),\n        s('web', 'db', 'INSERT AiBidAnalyses', { RequestJson: '...', ResponseJson: '...', Model: 'llama3' },\n          'Request and answer are stored as JSON text in SQL Server.', 'AiBidAnalyses', null),\n        s('web', 'committee', 'Show AI panel', { banner: 'AI is an assistant. The committee decides.' }, 'The committee sees the analysis with a clear label. It never replaces the human decision.', null, 'Tender: Closed → Under Evaluation'),\n      ],\n    },\n\n    // ───────────────────────── 8. EVALUATION ─────────────────────────\n    {\n      id: 'evaluation', title: 'Evaluation & unified report',\n      story: 'The four committee members score the bids using the locked criteria and produce ONE combined report.',\n      actors: ['committee', 'web', 'db', 'officer', 'manager'],\n      steps: [\n        s('committee', 'web', 'POST /Evaluation/Technical/Score', { bidId: 301, scores: [{ criterionId: 1, score: 31, notes: 'Good PP quality' }, { criterionId: 2, score: 22 }] },\n          'The technical member scores each criterion and writes observations.', 'TechnicalEvaluations', null),\n        s('committee', 'web', 'POST /Evaluation/Financial/Save', { bidId: 301, totalCost: 91500, taxesAndFees: 4200, logisticsCost: 2800, score: 36 },\n          'The financial member reviews price, taxes, transport, payment terms and validity.', 'FinancialEvaluations', null),\n        s('committee', 'officer', 'Clarification request', { subject: 'Missing ISO certificate', bidId: 302 },\n          'If something is unclear, the committee asks the officer, who asks the supplier.', 'Clarifications', null),\n        s('committee', 'web', 'POST /Evaluation/Report/Create', { tenderId: 14, recommendedBidId: 301, technicalSummary: '...', financialSummary: '...', justification: 'Best value for money' },\n          'After all four members approve, the single unified report is created with scores, non-compliance, comparison and recommendation.', 'EvaluationReports', 'Report: Recommendation Pending'),\n        s('web', 'manager', 'Notify manager', { type: 'ReportReady', tender: 'TND-2026-014' }, 'The Sourcing Manager is notified.', 'Notifications', 'Tender: Under Evaluation → Awaiting Manager Review'),\n      ],\n    },\n\n    // ───────────────────────── 9. DECISION ─────────────────────────\n    {\n      id: 'decision', title: 'Manager & Top Committee',\n      story: 'Nour reviews the report. Because the value is high, the Top Committee takes the final decision.',\n      actors: ['manager', 'web', 'db', 'top', 'supplier'],\n      steps: [\n        s('manager', 'web', 'GET /Manager/Reports/14', {}, 'Nour reads the report, scores, AI analysis and clarification history.', 'EvaluationReports (read)', null),\n        s('manager', 'web', 'POST /Manager/Decisions/Submit', { reportId: 9, decision: 'Approved', comment: 'Agree with committee', forwardToTopCommittee: true },\n          'Approve, reject, or return with comments. Return sends it back to the committee.', 'TenderApprovals (Manager), EvaluationReports.Status', 'Report: Manager Approved · Tender: Awaiting Committee Decision'),\n        s('web', 'top', 'Notify Top Committee', { type: 'DecisionRequired', tender: 'TND-2026-014' }, 'All four members get the package: request, bids, report, manager notes.', 'Notifications', null),\n        s('top', 'web', 'POST /Committee/Decisions/Vote', { tenderId: 14, vote: 'Approve', selectedBidId: 301, comment: 'Reliable supplier' },\n          'Each member votes. Every vote and its justification are saved. Members can also ask for more details.', 'TopCommitteeVotes', null),\n        s('web', 'db', 'Count votes + sign', { approve: 3, reject: 1, signatureHash: 'sha256:...' }, 'When the votes are in, the final decision is recorded (optionally digitally signed).', 'TenderApprovals (TopCommittee), Tenders.AwardedSupplierId', 'Report: Committee Approved · Tender: Awarded'),\n        s('web', 'supplier', 'Award notification', { winner: 'BottlePro Co.', result: 'Awarded' }, 'The winner and the other suppliers are notified. The tender is closed and archived, with a full audit trail.', 'Notifications, AuditLogs', null),\n      ],\n    },\n\n    // ───────────────────────── 10. CLARIFICATION ─────────────────────────\n    {\n      id: 'clarification', title: 'Clarification request',\n      story: 'Omar needs a missing certificate from BottlePro. The system only allows communication between roles that are directly involved at this stage.',\n      actors: ['officer', 'web', 'db', 'supplier', 'mail'],\n      steps: [\n        s('officer', 'web', 'GET /Shared/Clarifications/Allowed', { tenderId: 14, myRole: 'SourcingOfficer' },\n          'The system calculates who this user may contact, based on role and process stage (for example Officer ↔ Supplier of this tender).', 'Invitations, CommitteeMembers (read)', null),\n        s('officer', 'web', 'POST /Shared/Clarifications/Create', { receiverId: 'bottlepro-user', tenderId: 14, bidId: 301, subject: 'Missing ISO certificate', description: 'Please upload the ISO 9001 certificate.' },\n          'A request with subject and details, linked to the related tender and bid.', 'Clarifications', 'Clarification: Pending'),\n        s('web', 'mail', 'Notify receiver', { type: 'ClarificationReceived' }, 'The supplier gets an in-app notification.', 'Notifications', null),\n        s('supplier', 'web', 'POST /Shared/Clarifications/Reply', { clarificationId: 21, body: 'Uploaded, please check.', attachment: 'iso9001.pdf' },\n          'Only the two people involved (and authorized roles) can see this thread.', 'ClarificationMessages, Clarifications.Status', 'Clarification: Pending → Answered'),\n        s('officer', 'web', 'POST /Shared/Clarifications/Resolve', { clarificationId: 21 },\n          'The sender closes the thread. Everything stays in the history of the tender.', 'Clarifications.Status, ResolvedAt, AuditLogs', 'Clarification: Answered → Resolved'),\n      ],\n    },\n  ];\n\n  return { actors, cycles };\n})();\n<\/script>\n<script>\n  document.getElementById('n-tables').textContent = DB.tables.length;\n  document.getElementById('n-rel').textContent = DB.relations.length;\n  document.getElementById('n-cycles').textContent = FLOW.cycles.length;\n<\/script>\n<\/body>\n<\/html>\n","schema":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Schema Diagram<\/title>\n<style>/* Shared look: white background, big readable font, clear colors */\n@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');\n\n:root {\n  --bg: #ffffff;\n  --ink: #0f172a;\n  --muted: #475569;\n  --line: #e2e8f0;\n  --soft: #f8fafc;\n  --brand: #be185d;\n  --brand-soft: #fdf2f8;\n  --blue: #1d4ed8;\n  --radius: 18px;\n  --mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;\n}\n\n* { box-sizing: border-box; }\nhtml { font-size: 20px; }\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;\n  line-height: 1.6;\n}\na { color: var(--blue); }\nh1 { font-size: 2.4rem; line-height: 1.15; margin: 0 0 .4rem; font-weight: 800; letter-spacing: -.02em; }\nh2 { font-size: 1.6rem; margin: 2rem 0 .6rem; font-weight: 800; }\nh3 { font-size: 1.2rem; margin: 1.2rem 0 .4rem; font-weight: 700; }\np  { margin: .4rem 0 1rem; }\ncode, pre { font-family: var(--mono); }\n.muted { color: var(--muted); }\n\n/* ---------- top navigation ---------- */\n.topnav {\n  position: sticky; top: 0; z-index: 50;\n  background: #fff; border-bottom: 2px solid var(--line);\n  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;\n  padding: .6rem 1.5rem;\n}\n.topnav .brand { font-weight: 800; font-size: 1.1rem; color: var(--brand); text-decoration: none; margin-right: 1rem; }\n.topnav a.link {\n  text-decoration: none; color: var(--ink); font-weight: 600; font-size: .85rem;\n  padding: .35rem .8rem; border-radius: 999px;\n}\n.topnav a.link:hover { background: var(--soft); }\n.topnav a.link.active { background: var(--brand); color: #fff; }\n\n.wrap { max-width: 1500px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }\n.pagehead { padding: 1.5rem 0 .5rem; }\n.pagehead p { color: var(--muted); max-width: 70ch; font-size: 1rem; }\n\nfooter.site { border-top: 2px solid var(--line); padding: 1.2rem 1.5rem; color: var(--muted); font-size: .8rem; text-align: center; }\n\n/* ---------- cards / badges / buttons ---------- */\n.grid { display: grid; gap: 1.1rem; }\n.cards { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }\n.card {\n  border: 2px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.3rem; background: #fff;\n}\na.card { text-decoration: none; color: inherit; transition: .15s; display: block; }\na.card:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(15,23,42,.08); }\n.card h3 { margin-top: 0; }\n.badge {\n  display: inline-block; padding: .05rem .6rem; border-radius: 999px;\n  font-size: .7rem; font-weight: 700; letter-spacing: .02em; color: #fff; background: var(--muted);\n}\n.badge.pk { background: #ca8a04; }\n.badge.fk { background: #2563eb; }\n.badge.uq { background: #7c3aed; }\n.badge.null { background: #94a3b8; }\n.btn {\n  font: inherit; font-weight: 700; font-size: .85rem; cursor: pointer;\n  border: 2px solid var(--ink); background: #fff; color: var(--ink);\n  padding: .45rem 1.1rem; border-radius: 12px;\n}\n.btn:hover { background: var(--soft); }\n.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }\n.btn.primary:hover { filter: brightness(1.08); }\n.btn:disabled { opacity: .4; cursor: not-allowed; }\n\n.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: .8rem 0; }\n.chip {\n  font: inherit; font-size: .8rem; font-weight: 700; cursor: pointer;\n  border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: .25rem .9rem;\n}\n.chip.on { color: #fff; border-color: transparent; }\n\ntable.simple { border-collapse: collapse; width: 100%; font-size: .85rem; }\ntable.simple th, table.simple td { text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }\ntable.simple th { background: var(--soft); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }\n<\/style>\n<style>\n  body { overflow-x: hidden; }\n  .head { padding: 1rem 1.5rem .2rem; }\n  .head h1 { font-size: 1.8rem; margin: 0; }\n  .head p { margin: .2rem 0 .6rem; color: var(--muted); font-size: .9rem; max-width: 110ch; }\n  .toolbar { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; padding: 0 1.5rem .7rem; }\n  .toolbar input[type=search] { font: inherit; font-size: .85rem; padding: .35rem .9rem; border: 2px solid var(--line); border-radius: 10px; width: 230px; }\n  .toolbar label { font-weight: 600; font-size: .8rem; display: flex; gap: .35rem; align-items: center; cursor: pointer; }\n  .btn.sm { padding: .25rem .8rem; font-size: .8rem; border-radius: 10px; }\n  .legend { display: flex; flex-wrap: wrap; gap: .9rem; margin-left: auto; font-size: .75rem; font-weight: 700; }\n  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: .3rem; vertical-align: -1px; }\n\n  #viewport { position: relative; height: calc(100vh - 175px); min-height: 520px; border-top: 2px solid var(--line); background:\n      radial-gradient(circle, #e2e8f0 1.2px, transparent 1.3px) 0 0 / 28px 28px, #fff; overflow: hidden; cursor: grab; touch-action: none; }\n  #viewport.panning { cursor: grabbing; }\n  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }\n  #lines { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }\n\n  .tbl { position: absolute; width: 320px; background: #fff; border: 2px solid; border-radius: 10px; box-shadow: 0 2px 8px rgba(15,23,42,.1); user-select: none; transition: opacity .15s; }\n  .tbl header { color: #fff; font-weight: 800; font-size: 15px; height: 38px; line-height: 38px; padding: 0 12px; border-radius: 7px 7px 0 0; cursor: move; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; height: 28px; padding: 0 12px; font-size: 13.5px; border-top: 1px solid #eef2f7; }\n  .row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n  .row .t { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }\n  .row.pk .n { font-weight: 800; }\n  .row.fk { background: #eff6ff; }\n  .k { display: inline-block; font-size: 9.5px; font-weight: 800; color: #fff; border-radius: 4px; padding: 0 4px; margin-right: 5px; vertical-align: 1px; }\n  .k.pk { background: #ca8a04; } .k.fk { background: #2563eb; } .k.uq { background: #7c3aed; }\n  .tbl.dim { opacity: .22; }\n  .tbl.sel { box-shadow: 0 0 0 5px rgba(190,24,93,.25), 0 8px 24px rgba(15,23,42,.25); z-index: 5; }\n\n  #info { position: absolute; right: 14px; top: 14px; width: 360px; max-height: calc(100% - 28px); overflow: auto; background: #fff; border: 3px solid var(--line); border-radius: 18px; padding: 1rem 1.2rem; box-shadow: 0 10px 30px rgba(15,23,42,.18); cursor: default; }\n  #info h2 { margin: .2rem 0 0; font-size: 1.25rem; }\n  #info h3 { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 1rem 0 .4rem; }\n  #info p { font-size: .8rem; margin: .3rem 0; color: var(--muted); }\n  .rel { display: block; width: 100%; text-align: left; font: inherit; font-size: .8rem; cursor: pointer; border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: .3rem .7rem; margin-bottom: .4rem; }\n  .rel:hover { background: var(--soft); }\n  .rel b { font-size: .9rem; } .rel span { color: var(--muted); display: block; font-size: .72rem; }\n  .hint { position: absolute; left: 14px; bottom: 12px; background: rgba(255,255,255,.95); border: 2px solid var(--line); border-radius: 12px; padding: .35rem .9rem; font-size: .78rem; color: var(--muted); }\n<\/style>\n<style>.topnav,footer.site{display:none!important}#panel{top:16px!important;max-height:calc(100vh - 32px)!important}<\/style><!--SUB--><\/head>\n<body>\n  <div class=\"head\">\n    <h1>Schema Diagram<\/h1>\n    <p>Every table with all its columns. Lines connect a foreign key (FK) to the primary key it points to: <b>||<\/b> = the &ldquo;one&rdquo; side, <b>crow&rsquo;s foot<\/b> = the &ldquo;many&rdquo; side. <b>Click a table<\/b> to highlight its relations. Drag the background to pan, the mouse wheel to zoom, drag a table header to move it.<\/p>\n  <\/div>\n\n  <div class=\"toolbar\">\n    <button class=\"btn sm\" id=\"fit\">Fit all<\/button>\n    <button class=\"btn sm\" id=\"zin\">+<\/button>\n    <button class=\"btn sm\" id=\"zout\">&minus;<\/button>\n    <input id=\"search\" type=\"search\" placeholder=\"Find a table...\">\n    <label><input id=\"noUsers\" type=\"checkbox\"> Hide links to AspNetUsers<\/label>\n    <button class=\"btn sm\" id=\"clear\">Clear selection<\/button>\n    <div class=\"legend\" id=\"legend\"><\/div>\n  <\/div>\n\n  <div id=\"viewport\">\n    <div id=\"world\"><svg id=\"lines\"><\/svg><\/div>\n    <aside id=\"info\" hidden><\/aside>\n    <div class=\"hint\" id=\"zoomHint\">100%<\/div>\n  <\/div>\n\n<script>/*\n  Single source of truth for the database design.\n  Schema page, ER page and SQL page all read from here.\n\n  Column mini-format:  \"Name type FLAGS...\"\n    PK        primary key (two PK columns = composite key)\n    UQ        unique\n    NULL      nullable (everything else is NOT NULL)\n    FK>Table  foreign key to Table.Id\n    CK:A|B_C  CHECK constraint with allowed values (\"_\" = space)\n    DEF:xxx   default value\n    ~verb_x   relationship name used in the ER diagram\n*/\n(function (root) {\n  const domains = {\n    identity:  { label: 'Users & Identity',        color: '#1d4ed8' },\n    biometric: { label: 'Biometrics (required)',   color: '#be185d' },\n    request:   { label: 'Purchase Requests',       color: '#c2410c' },\n    tender:    { label: 'Tenders',                 color: '#15803d' },\n    bid:       { label: 'Supplier Bids',           color: '#7e22ce' },\n    eval:      { label: 'Evaluation & Decisions',  color: '#0f766e' },\n    collab:    { label: 'Communication & Audit',   color: '#b45309' },\n  };\n\n  const raw = [\n    // ───────────── Users & Identity ─────────────\n    ['Departments', 'identity', 'Company departments such as Production, Packaging, R&D, Marketing, Finance.', [\n      'Id int PK', 'Name nvarchar(100) UQ', 'Code nvarchar(20) UQ', 'IsActive bit',\n    ]],\n    ['AspNetUsers', 'identity', 'Every login account (employees and suppliers). Managed by ASP.NET Core Identity plus our own columns.', [\n      'Id nvarchar(450) PK', 'UserName nvarchar(256)', 'NormalizedUserName nvarchar(256) UQ',\n      'Email nvarchar(256) UQ', 'NormalizedEmail nvarchar(256)', 'EmailConfirmed bit',\n      'PasswordHash nvarchar(max) NULL', 'SecurityStamp nvarchar(max) NULL', 'ConcurrencyStamp nvarchar(max) NULL',\n      'PhoneNumber nvarchar(30) NULL', 'TwoFactorEnabled bit', 'LockoutEnd datetimeoffset NULL',\n      'LockoutEnabled bit DEF:1', 'AccessFailedCount int',\n      'FullName nvarchar(150)', 'UserType nvarchar(20) CK:Employee|Supplier',\n      'DepartmentId int FK>Departments NULL ~works_in', 'JobTitle nvarchar(100) NULL',\n      'IsActive bit', 'MustChangePassword bit',\n      'OnboardingStatus nvarchar(30) CK:NotStarted|InProgress|Completed DEF:\\'NotStarted\\'',\n      'BiometricConsentAt datetime2 NULL', 'CreatedAt datetime2', 'LastLoginAt datetime2 NULL',\n    ]],\n    ['AspNetRoles', 'identity', 'Roles: Admin, Requester, SourcingOfficer, EvaluationCommittee, SourcingManager, TopCommittee, Supplier.', [\n      'Id nvarchar(450) PK', 'Name nvarchar(256) UQ', 'NormalizedName nvarchar(256)', 'ConcurrencyStamp nvarchar(max) NULL',\n    ]],\n    ['AspNetUserRoles', 'identity', 'Links users to roles (many-to-many).', [\n      'UserId nvarchar(450) PK FK>AspNetUsers ~has_role', 'RoleId nvarchar(450) PK FK>AspNetRoles ~assigned_to',\n    ]],\n    ['EmployeeProfiles', 'identity', 'Extra data every employee fills during onboarding.', [\n      'Id int PK', 'UserId nvarchar(450) UQ FK>AspNetUsers ~has_profile', 'EmployeeNumber nvarchar(30) UQ',\n      'HireDate date', 'WorkPhone nvarchar(30)', 'PreferredLanguage nvarchar(10) DEF:\\'en\\'',\n      'ProfilePhotoPath nvarchar(300) NULL', 'SignaturePath nvarchar(300) NULL',\n      'OnboardingCompletedAt datetime2 NULL',\n    ]],\n    ['SupplierProfiles', 'identity', 'Supplier company details and Admin verification status.', [\n      'Id int PK', 'UserId nvarchar(450) UQ FK>AspNetUsers ~owns_company',\n      'CompanyName nvarchar(200)', 'TaxNumber nvarchar(50) UQ', 'CommercialRegNumber nvarchar(50)',\n      'Country nvarchar(80)', 'City nvarchar(80)', 'Address nvarchar(300)',\n      'ContactPerson nvarchar(150)', 'ContactPhone nvarchar(30)', 'Website nvarchar(200) NULL',\n      'Category nvarchar(100)', 'Status nvarchar(20) CK:Pending|Approved|Rejected|Suspended DEF:\\'Pending\\'',\n      'StatusReason nvarchar(500) NULL', 'ReviewedByUserId nvarchar(450) FK>AspNetUsers NULL ~reviewed_by',\n      'ReviewedAt datetime2 NULL', 'CreatedAt datetime2',\n    ]],\n    ['SupplierDocuments', 'identity', 'Legal files uploaded by a supplier (license, tax certificate, commercial register).', [\n      'Id int PK', 'SupplierProfileId int FK>SupplierProfiles ~uploads', 'DocType nvarchar(50)',\n      'FilePath nvarchar(300)', 'ExpiryDate date NULL', 'UploadedAt datetime2  = {};\n  for (const t of tables) {\n    const d = domains[t.domain];\n    const el = document.createElement('div');\n    el.className = 'tbl';\n    el.style.borderColor = d.color;\n    el.innerHTML = `<header style=\"background:${d.color}\" title=\"${t.desc.replace(/\"/g, '&quot;')}\">${t.name}<\/header>` +\n      t.cols.map(c => `<div class=\"row ${c.pk ? 'pk' : ''} ${c.fk ? 'fk' : ''}\"><span class=\"n\">${c.pk ? '<span class=\"k pk\">PK<\/span>' : ''}${c.fk ? '<span class=\"k fk\">FK<\/span>' : ''}${c.uq && !c.pk ? '<span class=\"k uq\">UQ<\/span>' : ''}${c.name}${c.nullable ? '<span style=\"color:#94a3b8\">?<\/span>' : ''}<\/span><span class=\"t\">${c.type}<\/span><\/div>`).join('');\n    world.appendChild(el);\n    box[t.name] = el;\n  }\n\n  // ---------- legend ----------\n  $('legend').innerHTML = Object.values(domains).map(d => `<span><i style=\"background:${d.color}\"><\/i>${d.label}<\/span>`).join('');\n\n  // ---------- state ----------\n  let s = 1, tx = 0, ty = 0, selected = null;\n\n  function applyView() {\n    world.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;\n    $('zoomHint').textContent = Math.round(s * 100) + '%  zoom';\n  }\n  function place() { for (const t of tables) { box[t.name].style.left = pos[t.name].x + 'px'; box[t.name].style.top = pos[t.name].y + 'px'; } }\n\n  // ---------- lines with crow's foot ----------\n  function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }\n\n  function anchors(r) {\n    const child = byName[r.child], parent = byName[r.parent];\n    const ci = child.cols.findIndex(c => c.name === r.childCol);\n    const pi = Math.max(0, parent.cols.findIndex(c => c.name === r.parentCol));\n    const cp = pos[r.child], pp = pos[r.parent];\n    const cy = cp.y + HEAD + ci * ROW + ROW / 2, py = pp.y + HEAD + pi * ROW + ROW / 2;\n    let p1, p2, d1, d2;\n    if (cp.x + W + 20 < pp.x) { p1 = { x: cp.x + W, y: cy }; d1 = 1; p2 = { x: pp.x, y: py }; d2 = -1; }\n    else if (pp.x + W + 20 < cp.x) { p1 = { x: cp.x, y: cy }; d1 = -1; p2 = { x: pp.x + W, y: py }; d2 = 1; }\n    else { p1 = { x: cp.x + W, y: cy }; d1 = 1; p2 = { x: pp.x + W, y: py }; d2 = 1; }  // same column: loop on the right\n    return { p1, p2, d1, d2 };\n  }\n\n  function draw() {\n    svg.innerHTML = '';\n    const hideUsers = $('noUsers').checked;\n    const sel = selected;\n    const selColor = sel ? domains[byName[sel].domain].color : null;\n    const list = relations.filter(r => !(hideUsers && r.parent === 'AspNetUsers' && !(sel && (r.child === sel || r.parent === sel))));\n\n    // faint lines first, highlighted ones on top\n    const sorted = [...list].sort((a, b) => hl(a) - hl(b));\n    function hl(r) { return sel && (r.child === sel || r.parent === sel) ? 1 : 0; }\n\n    for (const r of sorted) {\n      const on = hl(r) === 1;\n      const { p1, p2, d1, d2 } = anchors(r);\n      const k = Math.max(60, Math.abs(p2.x - p1.x) / 2);\n      const color = on ? selColor : (sel ? '#cbd5e1' : domains[byName[r.child].domain].color);\n      const g = el('g', { opacity: sel ? (on ? 1 : .35) : .75 }, svg);\n      el('path', {\n        d: `M${p1.x},${p1.y} C${p1.x + d1 * k},${p1.y} ${p2.x + d2 * k},${p2.y} ${p2.x},${p2.y}`,\n        fill: 'none', stroke: color, 'stroke-width': on ? 3.2 : 1.7, 'stroke-linecap': 'round',\n      }, g);\n      // child end: crow's foot (many) or double bar (one-to-one)\n      const sw = on ? 3 : 1.8;\n      if (r.oneToOne) bars(g, p1, d1, color, sw); else foot(g, p1, d1, color, sw);\n      // parent end: double bar (exactly one)\n      bars(g, p2, d2, color, sw);\n    }\n  }\n  function foot(g, p, d, color, sw) {\n    const a = { x: p.x + d * 16, y: p.y };\n    for (const dy of [-8, 0, 8]) el('line', { x1: a.x, y1: a.y, x2: p.x, y2: p.y + dy, stroke: color, 'stroke-width': sw, 'stroke-linecap': 'round' }, g);\n  }\n  function bars(g, p, d, color, sw) {\n    for (const off of [8, 15]) el('line', { x1: p.x + d * off, y1: p.y - 8, x2: p.x + d * off, y2: p.y + 8, stroke: color, 'stroke-width': sw, 'stroke-linecap': 'round' }, g);\n  }\n\n  // ---------- selection ----------\n  function related(name) {\n    return { out: relations.filter(r => r.child === name), inn: relations.filter(r => r.parent === name) };\n  }\n  function select(name, center) {\n    selected = name;\n    const names = new Set(name ? [name] : []);\n    if (name) { const { out, inn } = related(name); out.forEach(r => names.add(r.parent)); inn.forEach(r => names.add(r.child)); }\n    for (const t of tables) {\n      box[t.name].classList.toggle('sel', t.name === name);\n      box[t.name].classList.toggle('dim', !!name && !names.has(t.name));\n    }\n    renderInfo();\n    draw();\n    if (center && name) focusOn([...names]);\n  }\n\n  function renderInfo() {\n    const p = $('info');\n    if (!selected) { p.hidden = true; return; }\n    const t = byName[selected], d = domains[t.domain], { out, inn } = related(selected);\n    p.hidden = false; p.style.borderColor = d.color;\n    const btn = (n, a, b) => `<button class=\"rel\" data-t=\"${n}\" style=\"border-left:7px solid ${domains[byName[n].domain].color}\"><b>${n}<\/b><span>${a}<\/span><span>${b}<\/span><\/button>`;\n    p.innerHTML = `\n      <span class=\"badge\" style=\"background:${d.color}\">${d.label}<\/span>\n      <h2 style=\"color:${d.color}\">${t.name}<\/h2>\n      <p>${t.desc}<\/p>\n      <h3>Depends on (${out.length})<\/h3>\n      ${out.length ? out.map(r => btn(r.parent, `via <b>${r.childCol}<\/b> &middot; many ${t.name} &rarr; one ${r.parent}`, r.oneToOne ? 'one-to-one' : (r.nullable ? 'optional link' : 'required link'))).join('') : '<p>Nothing &mdash; root table.<\/p>'}\n      <h3>Used by (${inn.length})<\/h3>\n      ${inn.length ? inn.map(r => btn(r.child, `via <b>${r.child}.${r.childCol}<\/b>`, `one ${t.name} &rarr; ${r.oneToOne ? 'one' : 'many'} ${r.child}`)).join('') : '<p>No table points here.<\/p>'}`;\n    p.querySelectorAll('.rel').forEach(b => b.onclick = () => select(b.dataset.t, true));\n  }\n\n  // ---------- pan / zoom ----------\n  function bounds(names) {\n    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;\n    for (const n of names) { const p = pos[n], h = height(byName[n]); x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x + W); y1 = Math.max(y1, p.y + h); }\n    return { x0, y0, x1, y1 };\n  }\n  function focusOn(names) {\n    const b = bounds(names), pad = 60;\n    const availW = vp.clientWidth - (selected ? 390 : 0);\n    s = Math.min(1.1, (availW - pad) / (b.x1 - b.x0), (vp.clientHeight - pad) / (b.y1 - b.y0));\n    tx = (availW - (b.x1 - b.x0) * s) / 2 - b.x0 * s;\n    ty = (vp.clientHeight - (b.y1 - b.y0) * s) / 2 - b.y0 * s;\n    applyView();\n  }\n  function fit() { selected = null; select(null); focusOn(tables.map(t => t.name)); }\n  function zoomAt(f, cx, cy) {\n    const ns = Math.max(.1, Math.min(2, s * f));\n    tx = cx - (cx - tx) * (ns / s); ty = cy - (cy - ty) * (ns / s); s = ns; applyView();\n  }\n\n  vp.addEventListener('wheel', e => {\n    e.preventDefault();\n    const r = vp.getBoundingClientRect();\n    zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);\n  }, { passive: false });\n\n  // drag: background = pan, header = move table, click = select\n  let drag = null;\n  vp.addEventListener('pointerdown', e => {\n    if (e.target.closest('#info')) return;\n    const hdr = e.target.closest('.tbl header');\n    const tbl = e.target.closest('.tbl');\n    drag = { x: e.clientX, y: e.clientY, tx, ty, moved: false, hdr: hdr ? hdr.parentNode : null, tbl, ox: 0, oy: 0 };\n    if (hdr) { const n = tables.find(t => box[t.name] === hdr.parentNode).name; drag.name = n; drag.ox = pos[n].x; drag.oy = pos[n].y; }\n    vp.setPointerCapture(e.pointerId);\n    if (!hdr) vp.classList.add('panning');\n  });\n  vp.addEventListener('pointermove', e => {\n    if (!drag) return;\n    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;\n    if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;\n    if (!drag.moved) return;\n    if (drag.name) { pos[drag.name].x = drag.ox + dx / s; pos[drag.name].y = drag.oy + dy / s; place(); draw(); }\n    else { tx = drag.tx + dx; ty = drag.ty + dy; applyView(); }\n  });\n  vp.addEventListener('pointerup', () => {\n    if (!drag) return;\n    vp.classList.remove('panning');\n    if (!drag.moved) {\n      const n = drag.tbl ? tables.find(t => box[t.name] === drag.tbl).name : null;\n      select(n && n !== selected ? n : null);\n    }\n    drag = null;\n  });\n\n  // ---------- toolbar ----------\n  $('fit').onclick = fit;\n  $('zin').onclick = () => zoomAt(1.25, vp.clientWidth / 2, vp.clientHeight / 2);\n  $('zout').onclick = () => zoomAt(1 / 1.25, vp.clientWidth / 2, vp.clientHeight / 2);\n  $('clear').onclick = () => select(null);\n  $('noUsers').onchange = draw;\n  $('search').oninput = e => {\n    const q = e.target.value.trim().toLowerCase();\n    if (!q) return;\n    const t = tables.find(t => t.name.toLowerCase().startsWith(q)) || tables.find(t => t.name.toLowerCase().includes(q));\n    if (t) select(t.name, true);\n  };\n  window.addEventListener('resize', () => { if (!selected) focusOn(tables.map(t => t.name)); });\n\n  place(); draw(); applyView();\n  const initial = new URLSearchParams(window.__SUB.search).get('t');\n  requestAnimationFrame(() => { fit(); if (byName[initial]) select(initial, true); });\n})();\n<\/script>\n<\/body>\n<\/html>\n","er":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>ER Diagram<\/title>\n<style>/* Shared look: white background, big readable font, clear colors */\n@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');\n\n:root {\n  --bg: #ffffff;\n  --ink: #0f172a;\n  --muted: #475569;\n  --line: #e2e8f0;\n  --soft: #f8fafc;\n  --brand: #be185d;\n  --brand-soft: #fdf2f8;\n  --blue: #1d4ed8;\n  --radius: 18px;\n  --mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;\n}\n\n* { box-sizing: border-box; }\nhtml { font-size: 20px; }\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;\n  line-height: 1.6;\n}\na { color: var(--blue); }\nh1 { font-size: 2.4rem; line-height: 1.15; margin: 0 0 .4rem; font-weight: 800; letter-spacing: -.02em; }\nh2 { font-size: 1.6rem; margin: 2rem 0 .6rem; font-weight: 800; }\nh3 { font-size: 1.2rem; margin: 1.2rem 0 .4rem; font-weight: 700; }\np  { margin: .4rem 0 1rem; }\ncode, pre { font-family: var(--mono); }\n.muted { color: var(--muted); }\n\n/* ---------- top navigation ---------- */\n.topnav {\n  position: sticky; top: 0; z-index: 50;\n  background: #fff; border-bottom: 2px solid var(--line);\n  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;\n  padding: .6rem 1.5rem;\n}\n.topnav .brand { font-weight: 800; font-size: 1.1rem; color: var(--brand); text-decoration: none; margin-right: 1rem; }\n.topnav a.link {\n  text-decoration: none; color: var(--ink); font-weight: 600; font-size: .85rem;\n  padding: .35rem .8rem; border-radius: 999px;\n}\n.topnav a.link:hover { background: var(--soft); }\n.topnav a.link.active { background: var(--brand); color: #fff; }\n\n.wrap { max-width: 1500px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }\n.pagehead { padding: 1.5rem 0 .5rem; }\n.pagehead p { color: var(--muted); max-width: 70ch; font-size: 1rem; }\n\nfooter.site { border-top: 2px solid var(--line); padding: 1.2rem 1.5rem; color: var(--muted); font-size: .8rem; text-align: center; }\n\n/* ---------- cards / badges / buttons ---------- */\n.grid { display: grid; gap: 1.1rem; }\n.cards { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }\n.card {\n  border: 2px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.3rem; background: #fff;\n}\na.card { text-decoration: none; color: inherit; transition: .15s; display: block; }\na.card:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(15,23,42,.08); }\n.card h3 { margin-top: 0; }\n.badge {\n  display: inline-block; padding: .05rem .6rem; border-radius: 999px;\n  font-size: .7rem; font-weight: 700; letter-spacing: .02em; color: #fff; background: var(--muted);\n}\n.badge.pk { background: #ca8a04; }\n.badge.fk { background: #2563eb; }\n.badge.uq { background: #7c3aed; }\n.badge.null { background: #94a3b8; }\n.btn {\n  font: inherit; font-weight: 700; font-size: .85rem; cursor: pointer;\n  border: 2px solid var(--ink); background: #fff; color: var(--ink);\n  padding: .45rem 1.1rem; border-radius: 12px;\n}\n.btn:hover { background: var(--soft); }\n.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }\n.btn.primary:hover { filter: brightness(1.08); }\n.btn:disabled { opacity: .4; cursor: not-allowed; }\n\n.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: .8rem 0; }\n.chip {\n  font: inherit; font-size: .8rem; font-weight: 700; cursor: pointer;\n  border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: .25rem .9rem;\n}\n.chip.on { color: #fff; border-color: transparent; }\n\ntable.simple { border-collapse: collapse; width: 100%; font-size: .85rem; }\ntable.simple th, table.simple td { text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }\ntable.simple th { background: var(--soft); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }\n<\/style>\n<style>\n  #stage { position: relative; border: 3px solid var(--line); border-radius: 22px; padding: 2.2rem; overflow-x: auto; background: #fff; }\n  #lines { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; overflow: visible; }\n  #grid { position: relative; z-index: 2; display: grid; gap: 4.5rem 6rem; justify-content: start; }\n  .ent {\n    width: 280px; background: #fff; border: 3px solid; border-radius: 12px; overflow: hidden; cursor: pointer; transition: .15s;\n  }\n  .ent:hover { box-shadow: 0 8px 22px rgba(15,23,42,.15); }\n  .ent header { padding: .45rem .8rem; color: #fff; font-weight: 800; font-size: .95rem; word-break: break-word; }\n  .ent ul { list-style: none; margin: 0; padding: .35rem 0; }\n  .ent li { display: flex; justify-content: space-between; gap: .5rem; padding: .12rem .8rem; font-size: .8rem; }\n  .ent li span:last-child { font-family: var(--mono); font-size: .68rem; color: var(--muted); }\n  .ent li.pk { font-weight: 800; }\n  .ent li.more { color: var(--muted); font-style: italic; }\n  .ent.ghost { border-style: dashed; opacity: .7; }\n  .ent.dim { opacity: .25; }\n  .legend { display: flex; flex-wrap: wrap; gap: 1.6rem; font-size: .85rem; color: var(--muted); margin: .8rem 0 0; }\n  .legend b { color: var(--ink); }\n<\/style>\n<style>.topnav,footer.site{display:none!important}#panel{top:16px!important;max-height:calc(100vh - 32px)!important}<\/style><!--SUB--><\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"pagehead\">\n    <h1>ER Diagram<\/h1>\n    <p>Pick a subject area. Boxes are entities, diamonds describe the relationship, and <b>1<\/b> / <b>N<\/b> show the cardinality. Dashed boxes belong to another area and are shown only for context. Click an entity to focus on it.<\/p>\n  <\/div>\n\n  <div class=\"chips\" id=\"tabs\"><\/div>\n  <div id=\"stage\"><svg id=\"lines\"><\/svg><div id=\"grid\"><\/div><\/div>\n  <div class=\"legend\">\n    <span><b>1 &mdash; N<\/b> one parent row has many child rows<\/span>\n    <span><b>1 &mdash; 1<\/b> exactly one on each side<\/span>\n    <span><b>Bold<\/b> = primary key<\/span>\n    <span><b>FK<\/b> = foreign key to another entity<\/span>\n  <\/div>\n<\/div>\n\n<script>/*\n  Single source of truth for the database design.\n  Schema page, ER page and SQL page all read from here.\n\n  Column mini-format:  \"Name type FLAGS...\"\n    PK        primary key (two PK columns = composite key)\n    UQ        unique\n    NULL      nullable (everything else is NOT NULL)\n    FK>Table  foreign key to Table.Id\n    CK:A|B_C  CHECK constraint with allowed values (\"_\" = space)\n    DEF:xxx   default value\n    ~verb_x   relationship name used in the ER diagram\n*/\n(function (root) {\n  const domains = {\n    identity:  { label: 'Users & Identity',        color: '#1d4ed8' },\n    biometric: { label: 'Biometrics (required)',   color: '#be185d' },\n    request:   { label: 'Purchase Requests',       color: '#c2410c' },\n    tender:    { label: 'Tenders',                 color: '#15803d' },\n    bid:       { label: 'Supplier Bids',           color: '#7e22ce' },\n    eval:      { label: 'Evaluation & Decisions',  color: '#0f766e' },\n    collab:    { label: 'Communication & Audit',   color: '#b45309' },\n  };\n\n  const raw = [\n    // ───────────── Users & Identity ─────────────\n    ['Departments', 'identity', 'Company departments such as Production, Packaging, R&D, Marketing, Finance.', [\n      'Id int PK', 'Name nvarchar(100) UQ', 'Code nvarchar(20) UQ', 'IsActive bit',\n    ]],\n    ['AspNetUsers', 'identity', 'Every login account (employees and suppliers). Managed by ASP.NET Core Identity plus our own columns.', [\n      'Id nvarchar(450) PK', 'UserName nvarchar(256)', 'NormalizedUserName nvarchar(256) UQ',\n      'Email nvarchar(256) UQ', 'NormalizedEmail nvarchar(256)', 'EmailConfirmed bit',\n      'PasswordHash nvarchar(max) NULL', 'SecurityStamp nvarchar(max) NULL', 'ConcurrencyStamp nvarchar(max) NULL',\n      'PhoneNumber nvarchar(30) NULL', 'TwoFactorEnabled bit', 'LockoutEnd datetimeoffset NULL',\n      'LockoutEnabled bit DEF:1', 'AccessFailedCount int',\n      'FullName nvarchar(150)', 'UserType nvarchar(20) CK:Employee|Supplier',\n      'DepartmentId int FK>Departments NULL ~works_in', 'JobTitle nvarchar(100) NULL',\n      'Is
