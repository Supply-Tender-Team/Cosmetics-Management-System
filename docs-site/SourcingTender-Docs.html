wrap;\n  padding: .6rem 1.5rem;\n}\n.topnav .brand { font-weight: 800; font-size: 1.1rem; color: var(--brand); text-decoration: none; margin-right: 1rem; }\n.topnav a.link {\n  text-decoration: none; color: var(--ink); font-weight: 600; font-size: .85rem;\n  padding: .35rem .8rem; border-radius: 999px;\n}\n.topnav a.link:hover { background: var(--soft); }\n.topnav a.link.active { background: var(--brand); color: #fff; }\n\n.wrap { max-width: 1500px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }\n.pagehead { padding: 1.5rem 0 .5rem; }\n.pagehead p { color: var(--muted); max-width: 70ch; font-size: 1rem; }\n\nfooter.site { border-top: 2px solid var(--line); padding: 1.2rem 1.5rem; color: var(--muted); font-size: .8rem; text-align: center; }\n\n/* ---------- cards / badges / buttons ---------- */\n.grid { display: grid; gap: 1.1rem; }\n.cards { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }\n.card {\n  border: 2px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.3rem; background: #fff;\n}\na.card { text-decoration: none; color: inherit; transition: .15s; display: block; }\na.card:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(15,23,42,.08); }\n.card h3 { margin-top: 0; }\n.badge {\n  display: inline-block; padding: .05rem .6rem; border-radius: 999px;\n  font-size: .7rem; font-weight: 700; letter-spacing: .02em; color: #fff; background: var(--muted);\n}\n.badge.pk { background: #ca8a04; }\n.badge.fk { background: #2563eb; }\n.badge.uq { background: #7c3aed; }\n.badge.null { background: #94a3b8; }\n.btn {\n  font: inherit; font-weight: 700; font-size: .85rem; cursor: pointer;\n  border: 2px solid var(--ink); background: #fff; color: var(--ink);\n  padding: .45rem 1.1rem; border-radius: 12px;\n}\n.btn:hover { background: var(--soft); }\n.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }\n.btn.primary:hover { filter: brightness(1.08); }\n.btn:disabled { opacity: .4; cursor: not-allowed; }\n\n.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: .8rem 0; }\n.chip {\n  font: inherit; font-size: .8rem; font-weight: 700; cursor: pointer;\n  border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: .25rem .9rem;\n}\n.chip.on { color: #fff; border-color: transparent; }\n\ntable.simple { border-collapse: collapse; width: 100%; font-size: .85rem; }\ntable.simple th, table.simple td { text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }\ntable.simple th { background: var(--soft); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }\n<\/style>\n<style>\n  .story {\n    border-left: 8px solid var(--brand); background: var(--brand-soft); border-radius: 0 16px 16px 0;\n    padding: .9rem 1.3rem; margin: .8rem 0 1.2rem; font-size: 1rem;\n  }\n  .story b { color: var(--brand); }\n  .controls { display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }\n  .controls .count { font-weight: 800; font-size: 1rem; margin-left: .4rem; }\n\n  .main { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(380px, 1fr); gap: 1.4rem; align-items: start; }\n  @media (max-width: 1250px) { .main { grid-template-columns: 1fr; } }\n\n  #scroller { border: 3px solid var(--line); border-radius: 22px; max-height: 74vh; overflow: auto; background: #fff; position: relative; }\n  #actors { position: sticky; top: 0; z-index: 3; display: grid; gap: 0; padding: .7rem 0; background: rgba(255,255,255,.96); border-bottom: 2px solid var(--line); }\n  .actor { margin: 0 .35rem; border: 3px solid; border-radius: 14px; padding: .4rem .5rem; text-align: center; font-weight: 800; font-size: .78rem; line-height: 1.25; background: #fff; }\n  #svg { display: block; width: 100%; }\n\n  #panel { position: sticky; top: 80px; border: 3px solid var(--line); border-radius: 22px; padding: 1.3rem 1.5rem; background: #fff; max-height: calc(100vh - 100px); overflow: auto; }\n  #panel .stepno { font-weight: 800; color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }\n  #panel h2 { margin: .1rem 0 .6rem; font-size: 1.35rem; font-family: var(--mono); word-break: break-word; }\n  .route { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .8rem; }\n  .pill { color: #fff; font-weight: 700; font-size: .75rem; padding: .15rem .8rem; border-radius: 999px; }\n  .lab { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 1rem 0 .3rem; }\n  #panel p { font-size: .95rem; margin: 0; }\n  pre.json { background: #0f172a; color: #e2e8f0; padding: .9rem 1rem; border-radius: 14px; font-size: .72rem; line-height: 1.6; overflow: auto; margin: 0; white-space: pre-wrap; word-break: break-word; }\n  .dbline { background: #f0fdf4; border: 2px solid #bbf7d0; border-radius: 12px; padding: .5rem .8rem; font-size: .85rem; font-weight: 600; color: #166534; }\n  .status { background: #fffbeb; border: 2px solid #fde68a; border-radius: 12px; padding: .5rem .8rem; font-size: .85rem; font-weight: 700; color: #92400e; }\n\n  .dots { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1.2rem; }\n  .dots button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: #fff; font: inherit; font-weight: 800; font-size: .75rem; cursor: pointer; }\n  .dots button.done { background: #e2e8f0; }\n  .dots button.cur { background: var(--brand); color: #fff; border-color: var(--brand); }\n<\/style>\n<style>.topnav,footer.site{display:none!important}#panel{top:16px!important;max-height:calc(100vh - 32px)!important}<\/style><!--SUB--><\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"pagehead\">\n    <h1>Flow Story<\/h1>\n    <p>Choose a cycle, then press <b>Next<\/b> (or the right arrow key) to watch the story. Each arrow shows <b>who sends what to whom<\/b>. The panel explains what is inside the request, what happens, and what changes in the database.<\/p>\n  <\/div>\n\n  <div class=\"chips\" id=\"cycles\"><\/div>\n  <div class=\"story\" id=\"story\"><\/div>\n\n  <div class=\"controls\">\n    <button class=\"btn\" id=\"prev\">&larr; Back<\/button>\n    <button class=\"btn primary\" id=\"next\">Next &rarr;<\/button>\n    <button class=\"btn\" id=\"play\">&#9654; Auto-play<\/button>\n    <button class=\"btn\" id=\"reset\">Restart<\/button>\n    <span class=\"count\" id=\"count\"><\/span>\n  <\/div>\n\n  <div class=\"main\">\n    <div id=\"scroller\">\n      <div id=\"actors\"><\/div>\n      <svg id=\"svg\"><\/svg>\n    <\/div>\n    <aside id=\"panel\"><\/aside>\n  <\/div>\n<\/div>\n\n<script>/*\n  Story data for the Flow page.\n  Each cycle = actors (nodes) + steps (arrows).\n  A step says: who sends what to whom, what is inside the request, what happens, and what changes in the database.\n*/\nwindow.FLOW = (function () {\n  const actors = {\n    admin:     { name: 'Admin',                      color: '#1d4ed8' },\n    employee:  { name: 'Employee',                   color: '#be185d' },\n    requester: { name: 'Requesting Dept (Sara)',     color: '#c2410c' },\n    officer:   { name: 'Sourcing Officer (Omar)',    color: '#15803d' },\n    supplier:  { name: 'Supplier (BottlePro)',       color: '#7e22ce' },\n    committee: { name: 'Evaluation Committee',       color: '#0f766e' },\n    manager:   { name: 'Sourcing Manager (Nour)',    color: '#b45309' },\n    top:       { name: 'Top Committee',              color: '#be123c' },\n    user:      { name: 'User',                       color: '#be185d' },\n    web:       { name: 'Web App (ASP.NET MVC)',      color: '#0f172a' },\n    db:        { name: 'SQL Server',                 color: '#166534' },\n    device:    { name: 'Device (fingerprint / camera)', color: '#db2777' },\n    ai:        { name: 'Ollama AI',                  color: '#6d28d9' },\n    mail:      { name: 'Notifications / Email',      color: '#a16207' },\n  };\n\n  const s = (from, to, label, payload, what, db, status) => ({ from, to, label, payload, what, db, status });\n\n  const cycles = [\n    // ───────────────────────── 0. BIG PICTURE ─────────────────────────\n    {\n      id: 'big', title: 'Big picture',\n      story: 'Lumière Cosmetics needs 50,000 airless pump bottles for a new serum. Follow the request from the first idea to the awarded supplier.',\n      actors: ['requester', 'officer', 'supplier', 'committee', 'manager', 'top'],\n      steps: [\n        s('requester', 'officer', 'Purchase Request', { title: '50,000 airless pump bottles 30ml', priority: 'High', targetDate: '2026-12-15' },\n          'Sara from Packaging describes the need: what, how many, why and by when.', 'PurchaseRequisitions + Items', 'Request: Draft → Submitted'),\n        s('officer', 'requester', 'Review result', { decision: 'Approved', note: 'Specs are clear' },\n          'Omar checks the request. He can approve, return it for changes, or reject it.', 'PurchaseRequisitions.Status', 'Request: Submitted → Approved'),\n        s('officer', 'supplier', 'Tender invitation', { tender: 'TND-2026-014', deadline: '2026-11-30', criteria: 'Technical 60% / Financial 40%' },\n          'Omar turns the request into a tender, locks the scoring criteria, and invites approved suppliers.', 'Tenders, EvaluationCriteria, Invitations', 'Tender: Draft → Published · Invitation: Pending'),\n        s('supplier', 'officer', 'Accept + submit bid', { totalPrice: 91500, currency: 'USD', deliveryDays: 35, files: ['datasheet.pdf', 'sample.jpg'] },\n          'BottlePro accepts, then submits a price, delivery time and documents before the deadline. Other suppliers cannot see it.', 'Invitations, Bids, BidItems, BidDocuments', 'Invitation: Accepted · Bid: Submitted'),\n        s('officer', 'committee', 'Compliant bids', { compliant: 3, nonCompliant: 1, pendingClarification: 1 },\n          'Omar checks the mandatory documents. The tender closes at the deadline and the evaluation committee receives the compliant bids.', 'ComplianceChecks', 'Tender: Closed → Under Evaluation'),\n        s('committee', 'manager', 'Unified report', { recommendedBid: 'BottlePro', technicalScore: 86, financialScore: 91, justification: 'Best value, 35-day delivery' },\n          'Four members score technical and financial parts. They send ONE combined report with a recommendation (Ollama gave an initial opinion, humans decide).', 'EvaluationReports', 'Report: Recommendation Pending'),\n        s('manager', 'top', 'Forward (high value)', { decision: 'Approved', forwardToTopCommittee: true, comment: 'Value is above the policy limit' },\n          'Nour approves the recommendation. Because the tender is high value, it goes to the Top Committee.', 'TenderApprovals (Manager)', 'Tender: Awaiting Manager Review → Awaiting Committee Decision'),\n        s('top', 'supplier', 'Award announcement', { winner: 'BottlePro', votes: '3 approve / 1 reject', closed: true },\n          'The Top Committee votes, the winner is recorded, the tender is closed and everyone is notified.', 'TopCommitteeVotes, TenderApprovals, Tenders', 'Tender: Awarded'),\n      ],\n    },\n\n    // ───────────────────────── 1. EMPLOYEE ONBOARDING ─────────────────────────\n    {\n      id: 'onboarding', title: 'Employee onboarding',\n      story: 'Layla joins the Quality Control team. The Admin creates her account. Before she can enter any dashboard she must register BOTH her fingerprint and her face.',\n      actors: ['admin', 'employee', 'web', 'device', 'db'],\n      steps: [\n        s('admin', 'web', 'POST /Admin/Users/Create', { fullName: 'Layla Hassan', email: 'layla@lumiere.com', department: 'Quality Control', role: 'EvaluationCommittee' },\n          'Admin fills the form. The system generates a temporary password.', null, null),\n        s('web', 'db', 'INSERT user + role', { AspNetUsers: { MustChangePassword: true, OnboardingStatus: 'NotStarted' }, AspNetUserRoles: 'EvaluationCommittee' },\n          'The account is saved but locked into onboarding.', 'AspNetUsers, AspNetUserRoles', 'Onboarding: NotStarted'),\n        s('web', 'employee', 'Welcome email', { to: 'layla@lumiere.com', link: '/Account/Login', tempPassword: '********' },\n          'Layla receives her login link and temporary password.', null, null),\n        s('employee', 'web', 'POST /Onboarding/ChangePassword', { currentPassword: '********', newPassword: '********', confirm: '********' },\n          'First login forces a new password. Every other URL redirects to the onboarding wizard until it is finished.', 'AspNetUsers.PasswordHash', 'Onboarding: InProgress'),\n        s('employee', 'web', 'POST /Onboarding/Profile', { employeeNumber: 'QC-0142', hireDate: '2026-11-01', workPhone: '+20 100 000 0000', preferredLanguage: 'en', photo: 'file' },\n          'Layla completes her profile data.', 'EmployeeProfiles', null),\n        s('web', 'device', 'WebAuthn challenge', { challenge: 'k3F...random', rp: 'localhost', userVerification: 'required' },\n          'FINGERPRINT. The browser asks the laptop or phone to create a passkey. The device asks for her fingerprint.', null, null),\n        s('device', 'web', 'POST /Biometrics/Fingerprint/Register', { credentialId: 'AQID...', publicKey: 'MFkw...', deviceName: 'Layla iPhone', authenticatorType: 'platform' },\n          'The fingerprint NEVER leaves the device. Only a public key and a credential ID are sent. The server verifies it and keeps it.', 'BiometricCredentials', 'Fingerprint: registered'),\n        s('device', 'web', 'POST /Biometrics/Face/Enroll', { embedding: '[128 numbers]', livenessScore: 0.97, challengeActions: ['blink', 'turn-left'] },\n          'FACE. The camera opens and asks her to blink and turn her head (liveness), so a static photo is rejected. Only a numeric face template is sent, not the picture.', null, null),\n        s('web', 'db', 'INSERT FaceEnrollments', { UserId: 'layla', FaceTemplate: 'encrypted bytes', ModelVersion: 'face-v1', LivenessScore: 0.97 },\n          'The template is encrypted before it is saved.', 'FaceEnrollments', 'Face: registered'),\n        s('web', 'employee', 'Onboarding complete', { fingerprint: true, face: true, onboardingStatus: 'Completed', redirect: '/Evaluation/Dashboard' },\n          'The system checks that BOTH biometrics exist. Only then is the dashboard unlocked.', 'AspNetUsers.OnboardingStatus', 'Onboarding: Completed'),\n      ],\n    },\n\n    // ───────────────────────── 2. LOGIN ─────────────────────────\n    {\n      id: 'login', title: 'Login (3 ways)',\n      story: 'Layla can log in with email and password, with her fingerprint, or with her face. Every attempt is recorded.',\n      actors: ['user', 'web', 'device', 'db'],\n      steps: [\n        s('user', 'web', 'GET /Account/Login', {}, 'The login page shows three choices: password, fingerprint, face.', null, null),\n        s('user', 'web', 'A) POST /Account/Login', { email: 'layla@lumiere.com', password: '********' },\n          'PATH A, PASSWORD. Identity checks the password hash. Wrong passwords count toward lockout.', 'AspNetUsers.AccessFailedCount', null),\n        s('user', 'web', 'B) POST /Account/Passkey/Options', { email: 'layla@lumiere.com' },\n          'PATH B, FINGERPRINT. The server looks up her registered passkeys and creates a one-time challenge.', 'BiometricCredentials (read)', null),\n        s('web', 'device', 'B) WebAuthn challenge', { challenge: 'n8Q...random', allowCredentials: ['AQID...'], userVerification: 'required' },\n          'The browser asks the device to sign the challenge. The device asks for her fingerprint.', null, null),\n        s('device', 'web', 'B) POST /Account/Passkey/Verify', { credentialId: 'AQID...', signature: 'MEUC...', authenticatorData: '...', clientDataJSON: '...' },\n          'The server checks the signature with the stored public key, checks the origin and the signCount, then signs her in.', 'BiometricCredentials.SignCount', null),\n        s('device', 'web', 'C) POST /Account/Face/Verify', { email: 'layla@lumiere.com', embedding: '[128 numbers]', livenessProof: 'blink+turn', nonce: 'one-time' },\n          'PATH C, FACE. The camera does a liveness check. A static image or video replay is rejected. The server compares the new template with the stored one.', 'FaceEnrollments (read)', null),\n        s('web', 'db', 'Log the attempt', { Method: 'Face', Success: true, IpAddress: '10.0.0.8' },\n          'Success or failure, the attempt is saved. Too many failures lock the account.', 'BiometricAuthLogs', null),\n        s('web', 'user', 'Sign in + redirect', { cookie: 'authenticated', role: 'EvaluationCommittee', redirect: '/Evaluation/Dashboard' },\n          'A secure cookie is issued and the user lands on the dashboard of his or her role.', 'AspNetUsers.LastLoginAt', null),\n      ],\n    },\n\n    // ───────────────────────── 3. SUPPLIER REGISTRATION ─────────────────────────\n    {\n      id: 'supplier', title: 'Supplier registration',\n      story: 'BottlePro, a packaging manufacturer, wants to join the system. It registers itself, then waits for the Admin to verify its documents.',\n      actors: ['supplier', 'web', 'db', 'admin', 'mail'],\n      steps: [\n        s('supplier', 'web', 'POST /Account/RegisterSupplier', { companyName: 'BottlePro Co.', taxNumber: '123-456-789', commercialReg: 'CR-889', contactPerson: 'Ali', email: 'sales@bottlepro.com', password: '********', documents: ['license.pdf', 'tax.pdf'] },\n          'Self-registration form with Data Annotation validation. Files are checked (type, size) before saving.', null, null),\n        s('web', 'db', 'INSERT supplier', { AspNetUsers: { UserType: 'Supplier', IsActive: false }, SupplierProfiles: { Status: 'Pending' }, SupplierDocuments: 2 },\n          'The account exists but cannot log in until the Admin approves it.', 'AspNetUsers, SupplierProfiles, SupplierDocuments', 'Supplier: Pending'),\n        s('web', 'admin', 'Notify Admin', { type: 'NewSupplier', title: 'BottlePro Co. is waiting for review' },\n          'The Admin sees a new item in the notification bell and on the dashboard.', 'Notifications', null),\n        s('admin', 'web', 'GET /Admin/Suppliers/Review/12', {}, 'The Admin opens the company data and the uploaded legal documents.', 'SupplierProfiles (read)', null),\n        s('admin', 'web', 'POST /Admin/Suppliers/Decide', { supplierId: 12, status: 'Approved', reason: 'Documents valid until 2027' },\n          'Approved, Rejected or Suspended. A reason is always required for Rejected and Suspended.', 'SupplierProfiles.Status, AspNetUsers.IsActive, AuditLogs', 'Supplier: Pending → Approved'),\n        s('web', 'mail', 'Email the supplier', { to: 'sales@bottlepro.com', subject: 'Your account is approved' },\n          'The supplier can now log in. On the first login it must register fingerprint AND face (same onboarding as employees) before it can receive tender invitations.', 'Notifications', null),\n      ],\n    },\n\n    // ───────────────────────── 4. PURCHASE REQUEST ─────────────────────────\n    {\n      id: 'request', title: 'Purchase request',\n      story: 'Sara from Packaging creates a request. Omar returns it once because the specs are unclear, then approves it.',\n      actors: ['requester', 'web', 'db', 'officer', 'mail'],\n      steps: [\n        s('requester', 'web', 'POST /Requester/Requests/Create', { title: 'Airless pump bottles 30ml', reason: 'New serum launch', priority: 'High', targetDate: '2026-12-15', items: [{ name: 'Bottle 30ml', qty: 50000, unit: 'pcs', specs: 'PP, airless, matte white' }] },\n          'The form is validated on the client and again on the server.', 'PurchaseRequisitions, PurchaseRequisitionItems', 'Request: Draft'),\n        s('requester', 'web', 'POST /Requester/Requests/Submit/45', { id: 45 }, 'Sara sends it for review. A Draft can still be edited, a Submitted request cannot.', 'PurchaseRequisitions.Status', 'Request: Draft → Submitted'),\n        s('web', 'officer', 'Notify officer', { type: 'RequestSubmitted', link: '/Sourcing/Requests/45' }, 'Omar gets an alert and sees the request in his list.', 'Notifications', null),\n        s('officer', 'web', 'POST /Sourcing/Requests/Review', { id: 45, decision: 'Returned', note: 'Please add the cap material' },\n          'Returned means the requester must edit and resubmit. The note is saved in the history.', 'PurchaseRequisitions.ReviewNote, AuditLogs', 'Request: Under Review → Returned'),\n        s('requester', 'web', 'POST /Requester/Requests/Submit/45', { id: 45, updatedSpecs: 'PP, airless, matte white, aluminium cap' }, 'Sara fixes it and resubmits.', 'PurchaseRequisitionItems', 'Request: Returned → Submitted'),\n        s('officer', 'web', 'POST /Sourcing/Requests/Review', { id: 45, decision: 'Approved' },\n          'Approved requests become available for creating a tender.', 'PurchaseRequisitions.Status, AuditLogs', 'Request: Submitted → Approved'),\n        s('web', 'requester', 'Notify requester', { type: 'RequestApproved' }, 'Sara is told it was approved. She can follow it until award.', 'Notifications', null),\n      ],\n    },\n\n    // ───────────────────────── 5. TENDER ─────────────────────────\n    {\n      id: 'tender', title: 'Tender & invitations',\n      story: 'Omar converts the approved request into a tender, sets scoring weights, and invites suppliers.',\n      actors: ['officer', 'web', 'db', 'supplier', 'mail'],\n      steps: [\n        s('officer', 'web', 'POST /Sourcing/Tenders/Create', { requisitionId: 45, title: 'Airless bottles 30ml', terms: 'Delivery to Cairo plant', submissionDeadline: '2026-11-30 17:00', requiresTopCommittee: true },\n          'The tender is created from the approved request.', 'Tenders', 'Request: Approved → Converted to Tender · Tender: Draft'),\n        s('officer', 'web', 'POST /Sourcing/Tenders/Criteria', { criteria: [{ name: 'Material quality', type: 'Technical', weight: 35 }, { name: 'Compliance & samples', type: 'Technical', weight: 25 }, { name: 'Total cost', type: 'Financial', weight: 40 }] },\n          'Weights must add up to 100%. They are locked at publishing and cannot change after bids arrive.', 'EvaluationCriteria', null),\n        s('officer', 'web', 'POST /Sourcing/Tenders/Suppliers', { tenderId: 14, supplierIds: [12, 17, 23, 31] }, 'Only suppliers with status Approved can be selected.', 'TenderSuppliers', null),\n        s('officer', 'web', 'POST /Sourcing/Tenders/Publish/14', { tenderId: 14 }, 'Criteria are locked and invitations are created.', 'Tenders.Status, Invitations, EvaluationCriteria.IsLocked', 'Tender: Draft → Published · Invitations: Pending'),\n        s('web', 'mail', 'Send invitations', { recipients: 4, subject: 'You are invited: TND-2026-014' }, 'Each supplier gets an in-app notification and an email.', 'Notifications', null),\n        s('supplier', 'web', 'POST /Supplier/Invitations/Respond', { invitationId: 88, response: 'Accepted' }, 'Accept or decline. After the expiry date an unanswered invitation becomes Expired.', 'Invitations.Status', 'Invitation: Pending → Accepted'),\n      ],\n    },\n\n    // ───────────────────────── 6. BID ─────────────────────────\n    {\n      id: 'bid', title: 'Supplier bid',\n      story: 'BottlePro prepares its offer. The system makes sure no supplier can ever see another supplier\\'s bid.',\n      actors: ['supplier', 'web', 'db', 'officer', 'mail'],\n      steps: [\n        s('supplier', 'web', 'GET /Supplier/Tenders/14', {}, 'The supplier sees only tenders it was invited to. A different supplier would get 404.', 'Invitations (read)', null),\n        s('supplier', 'web', 'POST /Supplier/Offers/SaveDraft', { tenderId: 14, items: [{ requisitionItemId: 101, unitPrice: 1.75, tax: 0.12, shipping: 0.05 }], deliveryDays: 35, validityDays: 60, paymentTerms: '30% advance' },\n          'Drafts can be saved and edited many times.', 'Bids, BidItems', 'Bid: Draft'),\n        s('supplier', 'web', 'POST /Supplier/Offers/Upload', { bidId: 301, files: ['datasheet.pdf', 'sample.jpg', 'iso.pdf'] },\n          'Secure upload: allowed types only, size limit, random file name, stored outside the public web folder.', 'BidDocuments', null),\n        s('supplier', 'web', 'POST /Supplier/Offers/Submit', { bidId: 301 },\n          'The server checks: invitation accepted, deadline not passed, required fields and documents present.', 'Bids.Status, Bids.SubmittedAt, AuditLogs', 'Bid: Draft → Submitted'),\n        s('web', 'officer', 'Notify officer', { type: 'BidReceived', tender: 'TND-2026-014' }, 'Omar sees the counter go up, but bids stay sealed until the deadline.', 'Notifications', null),\n        s('web', 'db', 'Deadline job', { now: '2026-11-30 17:00:01' }, 'A background job closes the tender automatically at the deadline. Late submissions are rejected.', 'Tenders.Status', 'Tender: Open → Closed'),\n      ],\n    },\n\n    // ───────────────────────── 7. COMPLIANCE + AI ─────────────────────────\n    {\n      id: 'compliance', title: 'Compliance & AI analysis',\n      story: 'After the deadline Omar checks mandatory documents, then asks Ollama for a first analysis of each bid.',\n      actors: ['officer', 'web', 'db', 'ai', 'committee'],\n      steps: [\n        s('officer', 'web', 'GET /Sourcing/Offers/Compare/14', {}, 'Side-by-side table: price, delivery, specs, documents.', 'Bids, BidItems (read)', null),\n        s('officer', 'web', 'POST /Sourcing/Compliance/Check', { bidId: 301, result: 'Compliant' },\n          'Compliant, Non-Compliant (reason required) or Pending Clarification.', 'ComplianceChecks, Bids.Status', 'Bid: Submitted → Compliant'),\n        s('officer', 'web', 'POST /Sourcing/Ai/Analyze', { tenderId: 14, bidIds: [301, 302, 303] }, 'The officer presses \"Analyze with AI\".', null, null),\n        s('web', 'ai', 'POST :11434/api/generate', { model: 'llama3', format: 'json', prompt: 'Extract price, specs, delivery, missing files. Compare bids. Return JSON.', bids: '[bid data as JSON]' },\n          'The web app sends the bid data as JSON to the local Ollama server. Nothing leaves the company.', null, null),\n        s('ai', 'web', 'JSON answer', { price: 91500, deliveryDays: 35, missingFiles: ['ISO certificate'], strengths: ['Lowest price'], weaknesses: ['No sample'], recommendation: 'BottlePro' },\n          'The model replies with structured JSON.', null, null),\n        s('web', 'db', 'INSERT AiBidAnalyses', { RequestJson: '...', ResponseJson: '...', Model: 'llama3' },\n          'Request and answer are stored as JSON text in SQL Server.', 'AiBidAnalyses', null),\n        s('web', 'committee', 'Show AI panel', { banner: 'AI is an assistant. The committee decides.' }, 'The committee sees the analysis with a clear label. It never replaces the human decision.', null, 'Tender: Closed → Under Evaluation'),\n      ],\n    },\n\n    // ───────────────────────── 8. EVALUATION ─────────────────────────\n    {\n      id: 'evaluation', title: 'Evaluation & unified report',\n      story: 'The four committee members score the bids using the locked criteria and produce ONE combined report.',\n      actors: ['committee', 'web', 'db', 'officer', 'manager'],\n      steps: [\n        s('committee', 'web', 'POST /Evaluation/Technical/Score', { bidId: 301, scores: [{ criterionId: 1, score: 31, notes: 'Good PP quality' }, { criterionId: 2, score: 22 }] },\n          'The technical member scores each criterion and writes observations.', 'TechnicalEvaluations', null),\n        s('committee', 'web', 'POST /Evaluation/Financial/Save', { bidId: 301, totalCost: 91500, taxesAndFees: 4200, logisticsCost: 2800, score: 36 },\n          'The financial member reviews price, taxes, transport, payment terms and validity.', 'FinancialEvaluations', null),\n        s('committee', 'officer', 'Clarification request', { subject: 'Missing ISO certificate', bidId: 302 },\n          'If something is unclear, the committee asks the officer, who asks the supplier.', 'Clarifications', null),\n        s('committee', 'web', 'POST /Evaluation/Report/Create', { tenderId: 14, recommendedBidId: 301, technicalSummary: '...', financialSummary: '...', justification: 'Best value for money' },\n          'After all four members approve, the single unified report is created with scores, non-compliance, comparison and recommendation.', 'EvaluationReports', 'Report: Recommendation Pending'),\n        s('web', 'manager', 'Notify manager', { type: 'ReportReady', tender: 'TND-2026-014' }, 'The Sourcing Manager is notified.', 'Notifications', 'Tender: Under Evaluation → Awaiting Manager Review'),\n      ],\n    },\n\n    // ───────────────────────── 9. DECISION ─────────────────────────\n    {\n      id: 'decision', title: 'Manager & Top Committee',\n      story: 'Nour reviews the report. Because the value is high, the Top Committee takes the final decision.',\n      actors: ['manager', 'web', 'db', 'top', 'supplier'],\n      steps: [\n        s('manager', 'web', 'GET /Manager/Reports/14', {}, 'Nour reads the report, scores, AI analysis and clarification history.', 'EvaluationReports (read)', null),\n        s('manager', 'web', 'POST /Manager/Decisions/Submit', { reportId: 9, decision: 'Approved', comment: 'Agree with committee', forwardToTopCommittee: true },\n          'Approve, reject, or return with comments. Return sends it back to the committee.', 'TenderApprovals (Manager), EvaluationReports.Status', 'Report: Manager Approved · Tender: Awaiting Committee Decision'),\n        s('web', 'top', 'Notify Top Committee', { type: 'DecisionRequired', tender: 'TND-2026-014' }, 'All four members get the package: request, bids, report, manager notes.', 'Notifications', null),\n        s('top', 'web', 'POST /Committee/Decisions/Vote', { tenderId: 14, vote: 'Approve', selectedBidId: 301, comment: 'Reliable supplier' },\n          'Each member votes. Every vote and its justification are saved. Members can also ask for more details.', 'TopCommitteeVotes', null),\n        s('web', 'db', 'Count votes + sign', { approve: 3, reject: 1, signatureHash: 'sha256:...' }, 'When the votes are in, the final decision is recorded (optionally digitally signed).', 'TenderApprovals (TopCommittee), Tenders.AwardedSupplierId', 'Report: Committee Approved · Tender: Awarded'),\n        s('web', 'supplier', 'Award notification', { winner: 'BottlePro Co.', result: 'Awarded' }, 'The winner and the other suppliers are notified. The tender is closed and archived, with a full audit trail.', 'Notifications, AuditLogs', null),\n      ],\n    },\n\n    // ───────────────────────── 10. CLARIFICATION ─────────────────────────\n    {\n      id: 'clarification', title: 'Clarification request',\n      story: 'Omar needs a missing certificate from BottlePro. The system only allows communication between roles that are directly involved at this stage.',\n      actors: ['officer', 'web', 'db', 'supplier', 'mail'],\n      steps: [\n        s('officer', 'web', 'GET /Shared/Clarifications/Allowed', { tenderId: 14, myRole: 'SourcingOfficer' },\n          'The system calculates who this user may contact, based on role and process stage (for example Officer ↔ Supplier of this tender).', 'Invitations, CommitteeMembers (read)', null),\n        s('officer', 'web', 'POST /Shared/Clarifications/Create', { receiverId: 'bottlepro-user', tenderId: 14, bidId: 301, subject: 'Missing ISO certificate', description: 'Please upload the ISO 9001 certificate.' },\n          'A request with subject and details, linked to the related tender and bid.', 'Clarifications', 'Clarification: Pending'),\n        s('web', 'mail', 'Notify receiver', { type: 'ClarificationReceived' }, 'The supplier gets an in-app notification.', 'Notifications', null),\n        s('supplier', 'web', 'POST /Shared/Clarifications/Reply', { clarificationId: 21, body: 'Uploaded, please check.', attachment: 'iso9001.pdf' },\n          'Only the two people involved (and authorized roles) can see this thread.', 'ClarificationMessages, Clarifications.Status', 'Clarification: Pending → Answered'),\n        s('officer', 'web', 'POST /Shared/Clarifications/Resolve', { clarificationId: 21 },\n          'The sender closes the thread. Everything stays in the history of the tender.', 'Clarifications.Status, ResolvedAt, AuditLogs', 'Clarification: Answered → Resolved'),\n      ],\n    },\n  ];\n\n  return { actors, cycles };\n})();\n<\/script>\n<script>(function () {\n  const { actors, cycles } = FLOW;\n  const $ = id => document.getElementById(id);\n  const COL = 210, ROW = 100, TOP = 40;\n  let cy = cycles[0], cur = 0, timer = null;\n\n  // ---- cycle chips ----\n  for (const c of cycles) {\n    const b = document.createElement('button');\n    b.className = 'chip'; b.textContent = c.title; b.dataset.id = c.id;\n    b.onclick = () => choose(c.id);\n    $('cycles').appendChild(b);\n  }\n\n  function choose(id) {\n    stop();\n    cy = cycles.find(c => c.id === id) || cycles[0];\n    cur = 0;\n    void 0;\n    document.querySelectorAll('#cycles .chip').forEach(b => {\n      const on = b.dataset.id === cy.id;\n      b.classList.toggle('on', on);\n      b.style.background = on ? '#be185d' : '#fff';\n      b.style.color = on ? '#fff' : '#0f172a';\n    });\n    $('story').innerHTML = '<b>Story:<\/b> ' + cy.story;\n    buildFrame();\n    render();\n    $('scroller').scrollTop = 0;\n  }\n\n  // ---- fixed part: actor boxes + lifelines ----\n  function buildFrame() {\n    const n = cy.actors.length;\n    $('actors').style.gridTemplateColumns = `repeat(${n}, 1fr)`;\n    $('actors').innerHTML = cy.actors.map(k =>\n      `<div class=\"actor\" style=\"border-color:${actors[k].color};color:${actors[k].color}\">${actors[k].name}<\/div>`).join('');\n  }\n\n  const esc = s => String(s).replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;');\n  const x = k => (cy.actors.indexOf(k) + .5) * COL;\n\n  function render() {\n    const n = cy.actors.length, W = n * COL, H = TOP + cy.steps.length * ROW + 30;\n    const svg = $('svg');\n    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);\n    let h = '';\n\n    // lifelines\n    cy.actors.forEach(k => {\n      h += `<line x1=\"${x(k)}\" y1=\"0\" x2=\"${x(k)}\" y2=\"${H}\" stroke=\"${actors[k].color}\" stroke-opacity=\".35\" stroke-width=\"3\" stroke-dasharray=\"3 9\" stroke-linecap=\"round\"/>`;\n    });\n\n    cy.steps.forEach((st, i) => {\n      const y = TOP + i * ROW + ROW / 2;\n      const dir = x(st.to) > x(st.from) ? 1 : -1;\n      const x1 = x(st.from) + dir * 6, x2 = x(st.to) - dir * 6;\n      const col = actors[st.from].color;\n      const active = i === cur, shown = i <= cur;\n      const op = shown ? 1 : .13;\n      const sw = active ? 6 : 3.5;\n      const stroke = active ? '#be185d' : (shown ? col : '#94a3b8');\n      const mid = (x1 + x2) / 2;\n\n      h += `<g class=\"step\" data-i=\"${i}\" style=\"cursor:pointer\" opacity=\"${op}\">`;\n      h += `<rect x=\"${Math.min(x1, x2) - 40}\" y=\"${y - ROW / 2 + 6}\" width=\"${Math.abs(x2 - x1) + 80}\" height=\"${ROW - 12}\" fill=\"${active ? '#fdf2f8' : 'transparent'}\" rx=\"14\"/>`;\n      h += `<line x1=\"${x1}\" y1=\"${y}\" x2=\"${x2 - dir * 12}\" y2=\"${y}\" stroke=\"${stroke}\" stroke-width=\"${sw}\" stroke-linecap=\"round\" ${shown ? '' : 'stroke-dasharray=\"6 8\"'}/>`;\n      h += `<polygon points=\"${x2},${y} ${x2 - dir * 20},${y - 11} ${x2 - dir * 20},${y + 11}\" fill=\"${stroke}\"/>`;\n      h += `<circle cx=\"${x1}\" cy=\"${y}\" r=\"16\" fill=\"${stroke}\"/><text x=\"${x1}\" y=\"${y}\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"17\" font-weight=\"800\" fill=\"#fff\">${i + 1}<\/text>`;\n      h += `<text x=\"${mid}\" y=\"${y - 20}\" text-anchor=\"middle\" font-size=\"${active ? 19 : 17}\" font-weight=\"${active ? 800 : 700}\" fill=\"${active ? '#be185d' : '#0f172a'}\" stroke=\"#fff\" stroke-width=\"7\" paint-order=\"stroke\" font-family=\"'JetBrains Mono', Consolas, monospace\">${esc(st.label)}<\/text>`;\n      if (active) {\n        h += `<circle r=\"10\" fill=\"#be185d\"><animateMotion dur=\"1.8s\" repeatCount=\"indefinite\" path=\"M${x1},${y} L${x2},${y}\"/><\/circle>`;\n      }\n      h += '<\/g>';\n    });\n    svg.innerHTML = h;\n    svg.querySelectorAll('.step').forEach(g => g.onclick = () => go(+g.dataset.i));\n\n    renderPanel();\n    $('count').textContent = `Step ${cur + 1} of ${cy.steps.length}`;\n    $('prev').disabled = cur === 0;\n    $('next').disabled = cur === cy.steps.length - 1;\n\n    // keep the active arrow in view\n    const sc = $('scroller'), scale = sc.clientWidth / W;\n    const yy = (TOP + cur * ROW + ROW / 2) * scale + 60;\n    sc.scrollTo({ top: Math.max(0, yy - sc.clientHeight / 2), behavior: 'smooth' });\n  }\n\n  function renderPanel() {\n    const st = cy.steps[cur], a = actors[st.from], b = actors[st.to];\n    const pretty = Object.keys(st.payload).length ? JSON.stringify(st.payload, null, 2) : '(no body)';\n    $('panel').style.borderColor = '#be185d';\n    $('panel').innerHTML = `\n      <div class=\"stepno\">Step ${cur + 1} / ${cy.steps.length}<\/div>\n      <h2>${esc(st.label)}<\/h2>\n      <div class=\"route\">\n        <span class=\"pill\" style=\"background:${a.color}\">${esc(a.name)}<\/span>\n        <b>&rarr;<\/b>\n        <span class=\"pill\" style=\"background:${b.color}\">${esc(b.name)}<\/span>\n      <\/div>\n      <div class=\"lab\">What happens<\/div>\n      <p>${esc(st.what)}<\/p>\n      <div class=\"lab\">What is inside the request<\/div>\n      <pre class=\"json\">${esc(pretty)}<\/pre>\n      ${st.db ? `<div class=\"lab\">Database<\/div><div class=\"dbline\">${esc(st.db)}<\/div>` : ''}\n      ${st.status ? `<div class=\"lab\">Status change<\/div><div class=\"status\">${esc(st.status)}<\/div>` : ''}\n      <div class=\"dots\">${cy.steps.map((_, i) => `<button data-i=\"${i}\" class=\"${i === cur ? 'cur' : i < cur ? 'done' : ''}\">${i + 1}<\/button>`).join('')}<\/div>`;\n    $('panel').querySelectorAll('.dots button').forEach(btn => btn.onclick = () => go(+btn.dataset.i));\n  }\n\n  function go(i) { cur = Math.max(0, Math.min(cy.steps.length - 1, i)); render(); }\n  function stop() { if (timer) { clearInterval(timer); timer = null; } $('play').innerHTML = '&#9654; Auto-play'; }\n\n  $('next').onclick = () => { stop(); go(cur + 1); };\n  $('prev').onclick = () => { stop(); go(cur - 1); };\n  $('reset').onclick = () => { stop(); go(0); };\n  $('play').onclick = () => {\n    if (timer) return stop();\n    if (cur === cy.steps.length - 1) go(0);\n    $('play').innerHTML = '&#10074;&#10074; Pause';\n    timer = setInterval(() => { if (cur >= cy.steps.length - 1) return stop(); go(cur + 1); }, 4200);\n  };\n  document.addEventListener('keydown', e => {\n    if (e.key === 'ArrowRight') { stop(); go(cur + 1); }\n    if (e.key === 'ArrowLeft') { stop(); go(cur - 1); }\n  });\n  window.addEventListener('resize', () => render());\n\n  choose(window.__SUB.hash.slice(1) || cycles[0].id);\n})();\n<\/script>\n<\/body>\n<\/html>\n","pages":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Pages & Roles<\/title>\n<style>/* Shared look: white background, big readable font, clear colors */\n@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');\n\n:root {\n  --bg: #ffffff;\n  --ink: #0f172a;\n  --muted: #475569;\n  --line: #e2e8f0;\n  --soft: #f8fafc;\n  --brand: #be185d;\n  --brand-soft: #fdf2f8;\n  --blue: #1d4ed8;\n  --radius: 18px;\n  --mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;\n}\n\n* { box-sizing: border-box; }\nhtml { font-size: 20px; }\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;\n  line-height: 1.6;\n}\na { color: var(--blue); }\nh1 { font-size: 2.4rem; line-height: 1.15; margin: 0 0 .4rem; font-weight: 800; letter-spacing: -.02em; }\nh2 { font-size: 1.6rem; margin: 2rem 0 .6rem; font-weight: 800; }\nh3 { font-size: 1.2rem; margin: 1.2rem 0 .4rem; font-weight: 700; }\np  { margin: .4rem 0 1rem; }\ncode, pre { font-family: var(--mono); }\n.muted { color: var(--muted); }\n\n/* ---------- top navigation ---------- */\n.topnav {\n  position: sticky; top: 0; z-index: 50;\n  background: #fff; border-bottom: 2px solid var(--line);\n  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;\n  padding: .6rem 1.5rem;\n}\n.topnav .brand { font-weight: 800; font-size: 1.1rem; color: var(--brand); text-decoration: none; margin-right: 1rem; }\n.topnav a.link {\n  text-decoration: none; color: var(--ink); font-weight: 600; font-size: .85rem;\n  padding: .35rem .8rem; border-radius: 999px;\n}\n.topnav a.link:hover { background: var(--soft); }\n.topnav a.link.active { background: var(--brand); color: #fff; }\n\n.wrap { max-width: 1500px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }\n.pagehead { padding: 1.5rem 0 .5rem; }\n.pagehead p { color: var(--muted); max-width: 70ch; font-size: 1rem; }\n\nfooter.site { border-top: 2px solid var(--line); padding: 1.2rem 1.5rem; color: var(--muted); font-size: .8rem; text-align: center; }\n\n/* ---------- cards / badges / buttons ---------- */\n.grid { display: grid; gap: 1.1rem; }\n.cards { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }\n.card {\n  border: 2px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.3rem; background: #fff;\n}\na.card { text-decoration: none; color: inherit; transition: .15s; display: block; }\na.card:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(15,23,42,.08); }\n.card h3 { margin-top: 0; }\n.badge {\n  display: inline-block; padding: .05rem .6rem; border-radius: 999px;\n  font-size: .7rem; font-weight: 700; letter-spacing: .02em; color: #fff; background: var(--muted);\n}\n.badge.pk { background: #ca8a04; }\n.badge.fk { background: #2563eb; }\n.badge.uq { background: #7c3aed; }\n.badge.null { background: #94a3b8; }\n.btn {\n  font: inherit; font-weight: 700; font-size: .85rem; cursor: pointer;\n  border: 2px solid var(--ink); background: #fff; color: var(--ink);\n  padding: .45rem 1.1rem; border-radius: 12px;\n}\n.btn:hover { background: var(--soft); }\n.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }\n.btn.primary:hover { filter: brightness(1.08); }\n.btn:disabled { opacity: .4; cursor: not-allowed; }\n\n.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: .8rem 0; }\n.chip {\n  font: inherit; font-size: .8rem; font-weight: 700; cursor: pointer;\n  border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: .25rem .9rem;\n}\n.chip.on { color: #fff; border-color: transparent; }\n\ntable.simple { border-collapse: collapse; width: 100%; font-size: .85rem; }\ntable.simple th, table.simple td { text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }\ntable.simple th { background: var(--soft); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }\n<\/style>\n<style>\n  .page { border: 2.5px solid var(--line); border-radius: 18px; padding: 1rem 1.3rem; background: #fff; }\n  .page.main { border-width: 3px; }\n  .page h3 { margin: 0; font-size: 1.1rem; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }\n  .route { font-family: var(--mono); font-size: .72rem; color: var(--muted); margin: .15rem 0 .5rem; }\n  .page ul { margin: .3rem 0 .6rem; padding-left: 1.2rem; font-size: .85rem; }\n  .page li { margin: .15rem 0; }\n  .star { background: #fef3c7; color: #92400e; font-size: .65rem; font-weight: 800; padding: .05rem .55rem; border-radius: 999px; }\n  .cyc { display: inline-block; font-size: .7rem; font-weight: 700; text-decoration: none; border: 2px solid var(--line); border-radius: 999px; padding: .02rem .6rem; margin: 0 .3rem .2rem 0; color: var(--ink); }\n  .cyc:hover { border-color: var(--brand); color: var(--brand); }\n  .roleinfo { border-left: 8px solid; border-radius: 0 16px 16px 0; padding: .8rem 1.3rem; margin: 1rem 0 1.2rem; background: var(--soft); font-size: .95rem; }\n  .pcards { grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }\n<\/style>\n<style>.topnav,footer.site{display:none!important}#panel{top:16px!important;max-height:calc(100vh - 32px)!important}<\/style><!--SUB--><\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"pagehead\">\n    <h1>Pages &amp; Roles<\/h1>\n    <p>Every page of the system, grouped by who uses it: what it contains, and which flow cycle it belongs to. <span class=\"star\">&#9733; MAIN<\/span> marks the pages you should build first for the demo.<\/p>\n  <\/div>\n  <div class=\"chips\" id=\"roles\"><\/div>\n  <div class=\"roleinfo\" id=\"info\"><\/div>\n  <div class=\"grid pcards\" id=\"list\"><\/div>\n<\/div>\n\n<script>\n  // cycle ids match flow.html\n  const C = { onboarding: 'Employee onboarding', login: 'Login', supplier: 'Supplier registration', request: 'Purchase request', tender: 'Tender', bid: 'Supplier bid', compliance: 'Compliance & AI', evaluation: 'Evaluation', decision: 'Decisions', clarification: 'Clarification', big: 'Big picture' };\n\n  const ROLES = [\n    { id: 'public', name: 'Public', color: '#475569', area: '(no area)  ·  HomeController, AccountController',\n      info: 'Anyone, before logging in. Navbar and big footer layout.',\n      pages: [\n        ['Home', '/', true, ['Hero with headline and buttons', 'How it works: 6 steps', 'Real statistics from the database (active tenders, approved suppliers, completed requests)', 'Call to action: Login / Supplier Registration'], ['big']],\n        ['About', '/Home/About', false, ['Mission statement', 'Why the company moved from Excel and email to one platform'], []],\n        ['How It Works', '/Home/HowItWorks', false, ['Visual 12-step workflow', 'What each role does'], ['big']],\n        ['Contact', '/Home/Contact', false, ['Contact form with validation', 'Company details and map'], []],\n        ['Login', '/Account/Login', true, ['Email + password', 'Sign in with Fingerprint button', 'Sign in with Face button (camera + liveness)', 'Lockout message after too many failures'], ['login']],\n        ['Supplier Registration', '/Account/RegisterSupplier', true, ['Company data, tax and commercial numbers', 'Contact person and password', 'Upload license and tax documents', 'Message: waiting for Admin approval'], ['supplier']],\n      ] },\n    { id: 'onboard', name: 'Onboarding (all users)', color: '#be185d', area: 'Area: Shared  ·  OnboardingController',\n      info: 'Shown once, right after the first login, for employees AND suppliers. Nobody can open a dashboard until fingerprint AND face are both registered.',\n      pages: [\n        ['Change Password', '/Shared/Onboarding/ChangePassword', true, ['Replace the temporary password', 'Password strength rules'], ['onboarding']],\n        ['Complete Profile', '/Shared/Onboarding/Profile', true, ['Employee number, hire date, work phone', 'Preferred language, photo, signature image'], ['onboarding']],\n        ['Register Fingerprint', '/Shared/Onboarding/Fingerprint', true, ['Device name', 'Button starts the WebAuthn prompt on laptop or phone', 'Success tick when the passkey is saved'], ['onboarding']],\n        ['Register Face', '/Shared/Onboarding/Face', true, ['Camera preview', 'Liveness instructions (blink, turn head)', 'Static photos are rejected', 'Success tick when the template is saved'], ['onboarding']],\n        ['Finish', '/Shared/Onboarding/Complete', false, ['Summary of what was registered', 'Biometric consent confirmation', 'Go to my dashboard'], ['onboarding']],\n      ] },\n    { id: 'shared', name: 'Shared (all logged in)', color: '#0f172a', area: 'Area: Shared  ·  Notifications, Clarifications, Reports, Profile',\n      info: 'Pages every signed-in user has. They appear in the dashboard sidebar for each role.',\n      pages: [\n        ['Notifications', '/Shared/Notifications', true, ['List of alerts with unread count in the header', 'Mark as read', 'Click to open the related request, tender or bid'], ['clarification', 'request']],\n        ['Clarifications Inbox', '/Shared/Clarifications', true, ['Tabs: Sent, Received', 'Status filter: Pending, Answered, Resolved'], ['clarification']],\n        ['New Clarification', '/Shared/Clarifications/Create', false, ['Only allowed receivers are listed (by role and stage)', 'Subject, description, linked request/tender/bid'], ['clarification']],\n        ['Clarification Thread', '/Shared/Clarifications/Details/{id}', false, ['Messages with dates', 'Reply box', 'Resolve button for the sender'], ['clarification']],\n        ['Reports', '/Shared/Reports', false, ['Role-based reports with search and filters', 'Export to PDF and Excel', 'Suppliers see only their own bid history'], ['big']],\n        ['My Profile & Security', '/Shared/Profile', false, ['Edit profile', 'List my passkeys, add another device, revoke', 'Re-enroll face', 'Change password'], ['onboarding']],\n      ] },\n    { id: 'admin', name: 'Admin', color: '#1d4ed8', area: 'Area: Admin',\n      info: 'Configures the system. Does NOT take part in evaluations.',\n      pages: [\n        ['Admin Dashboard', '/Admin/Dashboard', true, ['Counts: users, suppliers, departments, requests, tenders', 'Pending supplier applications', 'Users who have not finished onboarding'], []],\n        ['Users', '/Admin/Users', true, ['List with search and role filter', 'Create user: name, email, department, role, job title', 'Enable / disable', 'Reset password and reset biometrics'], ['onboarding']],\n        ['Departments', '/Admin/Departments', false, ['Create, edit, deactivate departments'], []],\n        ['Suppliers Review', '/Admin/Suppliers', true, ['Applications list by status', 'Detail: company data and legal documents', 'Decision: Approved / Rejected / Suspended with reason'], ['supplier']],\n        ['Audit Logs', '/Admin/AuditLogs', false, ['Who did what and when', 'Filter by user, entity, date', 'Login attempts (face / fingerprint / password)'], []],\n      ] },\n    { id: 'requester', name: 'Requesting Department', color: '#c2410c', area: 'Area: Requester',\n      info: 'Internal teams that need products or services (Production, Packaging, R&D...).',\n      pages: [\n        ['Requester Dashboard', '/Requester/Dashboard', true, ['My requests by status', 'Task list with VOICE SEARCH (speech to text)', 'Latest review notes'], ['request']],\n        ['Create Purchase Request', '/Requester/Requests/Create', true, ['Title, reason, priority, target date', 'Items table: name, quantity, unit, specifications', 'Save draft / Submit'], ['request']],\n        ['My Requests', '/Requester/Requests', true, ['History with status badges', 'Filter and search'], ['request']],\n        ['Request Details', '/Requester/Requests/Details/{id}', false, ['Full request and items', 'Review notes and timeline', 'Edit when Draft or Returned', 'Clarification button'], ['request', 'clarification']],\n      ] },\n    { id: 'officer', name: 'Sourcing Officer', color: '#15803d', area: 'Area: Sourcing',\n      info: 'Turns approved requests into tenders and manages offers until they reach the evaluation committee.',\n      pages: [\n        ['Sourcing Dashboard', '/Sourcing/Dashboard', true, ['Approved requests, active tenders, incoming offers', 'Tenders closing soon', 'Voice search on task list'], ['tender']],\n        ['Incoming Requests', '/Sourcing/Requests', true, ['Review submitted requests', 'Approve / Return / Reject with note'], ['request']],\n        ['Tenders', '/Sourcing/Tenders', true, ['List by status', 'Create tender from approved request', 'Dates, terms, criteria and weights (must total 100%)'], ['tender']],\n        ['Select Suppliers & Invite', '/Sourcing/Tenders/Suppliers/{id}', true, ['Only Approved suppliers', 'Send invitations', 'Invitation status table'], ['tender']],\n        ['Compare Offers', '/Sourcing/Offers/Compare/{tenderId}', true, ['Side-by-side price, specs, delivery', 'Documents list', 'AI analysis button'], ['compliance']],\n        ['Compliance Check', '/Sourcing/Compliance/{bidId}', true, ['Checklist of mandatory documents', 'Compliant / Non-Compliant (reason) / Pending Clarification'], ['compliance']],\n        ['Evaluation Tracking', '/Sourcing/Evaluation/{tenderId}', false, ['Which members finished', 'Check that the unified report reached the Manager'], ['evaluation']],\n      ] },\n    { id: 'committee', name: 'Evaluation Committee', color: '#0f766e', area: 'Area: Evaluation',\n      info: 'Four members: Sourcing Manager, Department rep, Financial rep, Technical rep. They score offers and produce ONE unified report.',\n      pages: [\n        ['Committee Dashboard', '/Evaluation/Dashboard', true, ['Tenders assigned to me', 'Evaluation progress per member'], ['evaluation']],\n        ['Technical Evaluation', '/Evaluation/Technical/{bidId}', true, ['Proposals, documents, images, videos, samples', 'Score each criterion', 'Observations and non-compliance notes', 'Request clarification'], ['evaluation']],\n        ['Financial Evaluation', '/Evaluation/Financial/{bidId}', true, ['Prices, taxes, fees, transport, installation', 'Payment terms, currency, validity', 'Total cost comparison'], ['evaluation']],\n        ['AI Analysis View', '/Evaluation/Ai/{tenderId}', false, ['Ollama extraction and comparison', 'Strengths and weaknesses', 'Label: assistant only'], ['compliance']],\n        ['Unified Report', '/Evaluation/Report/{tenderId}', true, ['Scores, observations, non-compliance, comparison, final result', 'Recommendation with justification', 'Send to Sourcing Manager'], ['evaluation']],\n      ] },\n    { id: 'manager', name: 'Sourcing Manager', color: '#b45309', area: 'Area: Manager',\n      info: 'Reviews the unified report and decides, or forwards to the Top Committee.',\n      pages: [\n        ['Manager Dashboard', '/Manager/Dashboard', true, ['Reports waiting for me', 'Decisions history'], ['decision']],\n        ['Review Report', '/Manager/Reports/{tenderId}', true, ['Report, scores, AI analysis, clarification history'], ['decision']],\n        ['Decision', '/Manager/Decisions/{tenderId}', true, ['Approve / Reject / Return with comments', 'Forward to Top Committee for high-value tenders'], ['decision']],\n      ] },\n    { id: 'top', name: 'Top Committee', color: '#be123c', area: 'Area: Committee',\n      info: 'Four members take the final group decision for high-value tenders.',\n      pages: [\n        ['Committee Dashboard', '/Committee/Dashboard', true, ['Bids awaiting final action'], ['decision']],\n        ['Review Package', '/Committee/Review/{tenderId}', true, ['Requisition, bids, unified report, Manager recommendation', 'Technical and financial results and AI analysis'], ['decision']],\n        ['Final Decision / Vote', '/Committee/Decisions/{tenderId}', true, ['Vote: Approve / Reject / Need more info', 'Justification saved for each member', 'Optional digital signature'], ['decision']],\n        ['Bid History', '/Committee/History', false, ['Past tenders and decisions'], ['decision']],\n        ['Statistics Report', '/Committee/Statistics', false, ['Number of suppliers', 'How often each supplier was used', 'Download PDF / Excel'], []],\n      ] },\n    { id: 'supplier', name: 'Supplier', color: '#7e22ce', area: 'Area: Supplier',\n      info: 'External vendor. Can NEVER see other suppliers\\' offers.',\n      pages: [\n        ['Supplier Dashboard', '/Supplier/Dashboard', true, ['Invitations waiting', 'My offers and their status', 'Company approval status'], ['tender']],\n        ['Invitations', '/Supplier/Invitations', true, ['Accept or decline', 'Deadline countdown'], ['tender']],\n        ['Tender Details', '/Supplier/Tenders/{id}', false, ['Requirements and terms', 'Only for invited tenders'], ['bid']],\n        ['Submit Offer', '/Supplier/Offers/Create/{tenderId}', true, ['Item prices, delivery time, validity, payment terms', 'Technical details', 'Upload documents', 'Save draft / Submit / Withdraw'], ['bid']],\n        ['My Offers', '/Supplier/Offers', true, ['History with statuses', 'Download personal summary report'], ['bid']],\n        ['Company Profile', '/Supplier/Profile', false, ['Edit contact data', 'Upload renewed documents'], ['supplier']],\n      ] },\n  ];\n\n  const $ = id => document.getElementById(id);\n  function show(id) {\n    const r = ROLES.find(x => x.id === id);\n    document.querySelectorAll('#roles .chip').forEach(b => {\n      const on = b.dataset.id === id, c = ROLES.find(x => x.id === b.dataset.id).color;\n      b.style.background = on ? c : '#fff'; b.style.color = on ? '#fff' : '#0f172a'; b.style.borderColor = on ? c : '';\n    });\n    $('info').style.borderColor = r.color;\n    $('info').innerHTML = `<b style=\"color:${r.color}\">${r.name}<\/b> &mdash; ${r.info}<br><span class=\"muted\" style=\"font-size:.8rem;font-family:var(--mono)\">${r.area}<\/span>`;\n    $('list').innerHTML = r.pages.map(([name, route, main, feats, cycles]) => `\n      <div class=\"page ${main ? 'main' : ''}\" style=\"border-color:${main ? r.color : ''}\">\n        <h3 style=\"color:${r.color}\">${name} ${main ? '<span class=\"star\">&#9733; MAIN<\/span>' : ''}<\/h3>\n        <div class=\"route\">${route}<\/div>\n        <ul>${feats.map(f => `<li>${f}<\/li>`).join('')}<\/ul>\n        ${cycles.map(c => `<a class=\"cyc\" href=\"flow.html#${c}\">Cycle: ${C[c]}<\/a>`).join('')}\n      <\/div>`).join('');\n    void 0;\n  }\n  ROLES.forEach(r => {\n    const b = document.createElement('button'); b.className = 'chip'; b.textContent = r.name; b.dataset.id = r.id;\n    b.onclick = () => show(r.id); $('roles').appendChild(b);\n  });\n  show(ROLES.some(r => r.id === window.__SUB.hash.slice(1)) ? window.__SUB.hash.slice(1) : 'public');\n<\/script>\n<\/body>\n<\/html>\n","onboarding":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Onboarding Data<\/title>\n<style>/* Shared look: white background, big readable font, clear colors */\n@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');\n\n:root {\n  --bg: #ffffff;\n  --ink: #0f172a;\n  --muted: #475569;\n  --line: #e2e8f0;\n  --soft: #f8fafc;\n  --brand: #be185d;\n  --brand-soft: #fdf2f8;\n  --blue: #1d4ed8;\n  --radius: 18px;\n  --mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;\n}\n\n* { box-sizing: border-box; }\nhtml { font-size: 20px; }\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;\n  line-height: 1.6;\n}\na { color: var(--blue); }\nh1 { font-size: 2.4rem; line-height: 1.15; margin: 0 0 .4rem; font-weight: 800; letter-spacing: -.02em; }\nh2 { font-size: 1.6rem; margin: 2rem 0 .6rem; font-weight: 800; }\nh3 { font-size: 1.2rem; margin: 1.2rem 0 .4rem; font-weight: 700; }\np  { margin: .4rem 0 1rem; }\ncode, pre { font-family: var(--mono); }\n.muted { color: var(--muted); }\n\n/* ---------- top navigation ---------- */\n.topnav {\n  position: sticky; top: 0; z-index: 50;\n  background: #fff; border-bottom: 2px solid var(--line);\n  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;\n  padding: .6rem 1.5rem;\n}\n.topnav .brand { font-weight: 800; font-size: 1.1rem; color: var(--brand); text-decoration: none; margin-right: 1rem; }\n.topnav a.link {\n  text-decoration: none; color: var(--ink); font-weight: 600; font-size: .85rem;\n  padding: .35rem .8rem; border-radius: 999px;\n}\n.topnav a.link:hover { background: var(--soft); }\n.topnav a.link.active { background: var(--brand); color: #fff; }\n\n.wrap { max-width: 1500px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }\n.pagehead { padding: 1.5rem 0 .5rem; }\n.pagehead p { color: var(--muted); max-width: 70ch; font-size: 1rem; }\n\nfooter.site { border-top: 2px solid var(--line); padding: 1.2rem 1.5rem; color: var(--muted); font-size: .8rem; text-align: center; }\n\n/* ---------- cards / badges / buttons ---------- */\n.grid { display: grid; gap: 1.1rem; }\n.cards { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }\n.card {\n  border: 2px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.3rem; background: #fff;\n}\na.card { text-decoration: none; color: inherit; transition: .15s; display: block; }\na.card:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(15,23,42,.08); }\n.card h3 { margin-top: 0; }\n.badge {\n  display: inline-block; padding: .05rem .6rem; border-radius: 999px;\n  font-size: .7rem; font-weight: 700; letter-spacing: .02em; color: #fff; background: var(--muted);\n}\n.badge.pk { background: #ca8a04; }\n.badge.fk { background: #2563eb; }\n.badge.uq { background: #7c3aed; }\n.badge.null { background: #94a3b8; }\n.btn {\n  font: inherit; font-weight: 700; font-size: .85rem; cursor: pointer;\n  border: 2px solid var(--ink); background: #fff; color: var(--ink);\n  padding: .45rem 1.1rem; border-radius: 12px;\n}\n.btn:hover { background: var(--soft); }\n.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }\n.btn.primary:hover { filter: brightness(1.08); }\n.btn:disabled { opacity: .4; cursor: not-allowed; }\n\n.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: .8rem 0; }\n.chip {\n  font: inherit; font-size: .8rem; font-weight: 700; cursor: pointer;\n  border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: .25rem .9rem;\n}\n.chip.on { color: #fff; border-color: transparent; }\n\ntable.simple { border-collapse: collapse; width: 100%; font-size: .85rem; }\ntable.simple th, table.simple td { text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }\ntable.simple th { background: var(--soft); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }\n<\/style>\n<style>\n  .step { border: 3px solid var(--line); border-radius: 20px; padding: 1rem 1.4rem 1.2rem; margin: 1.2rem 0; background: #fff; }\n  .step h2 { margin: 0 0 .2rem; font-size: 1.25rem; display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; }\n  .num { width: 38px; height: 38px; border-radius: 50%; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: .95rem; }\n  .req { color: #be123c; font-weight: 800; }\n  .opt { color: var(--muted); }\n  .must { background: #fdf2f8; border: 3px solid #be185d; border-radius: 18px; padding: .9rem 1.3rem; font-size: .95rem; margin: 1rem 0; }\n  .tag { font-size: .7rem; font-weight: 800; padding: .05rem .6rem; border-radius: 999px; color: #fff; }\n<\/style>\n<style>.topnav,footer.site{display:none!important}#panel{top:16px!important;max-height:calc(100vh - 32px)!important}<\/style><!--SUB--><\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"pagehead\">\n    <h1>Onboarding Data<\/h1>\n    <p>What every user must fill in, step by step, and where each value is saved. Employees get an account from the Admin; suppliers register themselves.<\/p>\n  <\/div>\n\n  <div class=\"chips\">\n    <button class=\"chip\" id=\"b-emp\">Employees (6 roles)<\/button>\n    <button class=\"chip\" id=\"b-sup\">Suppliers (register + biometrics)<\/button>\n  <\/div>\n\n  <div id=\"emp\">\n    <div class=\"must\"><b>Rule:<\/b> an employee cannot open any dashboard until <b>BOTH<\/b> the fingerprint and the face are registered. The server checks <code>BiometricCredentials<\/code> AND <code>FaceEnrollments<\/code>, not just a flag on the page.<\/div>\n    <div id=\"empSteps\"><\/div>\n  <\/div>\n  <div id=\"sup\" hidden>\n    <div class=\"must\" style=\"border-color:#7e22ce;background:#faf5ff\"><b>Rule:<\/b> suppliers are users too, so fingerprint AND face are <b>required<\/b> for them as well. They register the company first, the Admin approves it, and on the <b>first login<\/b> the supplier completes the same biometric steps as an employee (steps 5 to 7).<\/div>\n    <div id=\"supSteps\"><\/div>\n  <\/div>\n<\/div>\n\n<script>\n  // field: [label, type/example, required?, filled by, saved in]\n  const A = 'Admin', E = 'Employee', S = 'System', U = 'Supplier';\n  const EMP = [\n    { t: 'Admin creates the account', c: '#1d4ed8', note: 'Done before the employee ever logs in.', f: [\n      ['Full name', 'text', 1, A, 'AspNetUsers.FullName'],\n      ['Work email', 'email (login name)', 1, A, 'AspNetUsers.Email'],\n      ['Department', 'choose from list', 1, A, 'AspNetUsers.DepartmentId'],\n      ['Role', 'Requester, SourcingOfficer, EvaluationCommittee, SourcingManager, TopCommittee, Admin', 1, A, 'AspNetUserRoles'],\n      ['Job title', 'text', 0, A, 'AspNetUsers.JobTitle'],\n      ['Temporary password', 'generated', 1, S, 'AspNetUsers.PasswordHash (must change = true)'],\n    ] },\n    { t: 'Step 1 · Secure the account', c: '#be185d', note: 'First login redirects here.', f: [\n      ['New password', 'min 10 chars, upper, lower, number, symbol', 1, E, 'AspNetUsers.PasswordHash'],\n      ['Confirm password', 'must match', 1, E, 'not saved'],\n    ] },\n    { t: 'Step 2 · Profile', c: '#c2410c', note: 'Used on reports, signatures and notifications.', f: [\n      ['Employee number', 'text, unique', 1, E, 'EmployeeProfiles.EmployeeNumber'],\n      ['Hire date', 'date', 1, E, 'EmployeeProfiles.HireDate'],\n      ['Work phone', 'phone', 1, E, 'EmployeeProfiles.WorkPhone'],\n      ['Preferred language', 'English / Arabic', 1, E, 'EmployeeProfiles.PreferredLanguage'],\n      ['Profile photo', 'image up to 2 MB', 0, E, 'EmployeeProfiles.ProfilePhotoPath'],\n      ['Signature image', 'PNG (needed for the digital-signature option)', 0, E, 'EmployeeProfiles.SignaturePath'],\n    ] },\n    { t: 'Step 3 · Fingerprint  (REQUIRED)', c: '#be185d', note: 'WebAuthn passkey. Works with Windows Hello, Touch ID, Android fingerprint. The fingerprint itself never leaves the device.', f: [\n      ['Device name', 'auto-filled, editable (e.g. \"Layla laptop\")', 1, E, 'BiometricCredentials.DeviceName'],\n      ['Fingerprint scan', 'done on the device prompt', 1, E, 'stays on the device'],\n      ['Credential ID + public key', 'created by the device', 1, S, 'BiometricCredentials.CredentialId / PublicKey'],\n      ['Second device', 'recommended for recovery', 0, E, 'another BiometricCredentials row'],\n    ] },\n    { t: 'Step 4 · Face  (REQUIRED)', c: '#be185d', note: 'Camera with liveness check. Static photos and videos must be rejected.', f: [\n      ['Camera permission', 'browser prompt', 1, E, 'not saved'],\n      ['Liveness actions', 'blink, turn head left / right', 1, E, 'LivenessScore'],\n      ['Face template', 'numeric vector, encrypted (no photo saved)', 1, S, 'FaceEnrollments.FaceTemplate'],\n    ] },\n    { t: 'Step 5 · Consent and finish', c: '#0f766e', note: 'Biometric data is personal data, so the employee must agree.', f: [\n      ['Biometric consent checkbox', 'checkbox', 1, E, 'AspNetUsers.BiometricConsentAt'],\n      ['Onboarding status', 'Completed', 1, S, 'AspNetUsers.OnboardingStatus'],\n    ] },\n  ];\n  const SUP = [\n    { t: 'Step 1 · Company', c: '#7e22ce', note: 'Self-registration page (public).', f: [\n      ['Company name', 'text', 1, U, 'SupplierProfiles.CompanyName'],\n      ['Tax number', 'text, unique', 1, U, 'SupplierProfiles.TaxNumber'],\n      ['Commercial registration number', 'text', 1, U, 'SupplierProfiles.CommercialRegNumber'],\n      ['Category', 'packaging, raw materials, fragrance, equipment...', 1, U, 'SupplierProfiles.Category'],\n      ['Country, city, address', 'text', 1, U, 'SupplierProfiles.Country / City / Address'],\n      ['Website', 'url', 0, U, 'SupplierProfiles.Website'],\n    ] },\n    { t: 'Step 2 · Contact and login', c: '#1d4ed8', note: '', f: [\n      ['Contact person', 'text', 1, U, 'SupplierProfiles.ContactPerson'],\n      ['Contact phone', 'phone', 1, U, 'SupplierProfiles.ContactPhone'],\n      ['Email', 'email (login name)', 1, U, 'AspNetUsers.Email'],\n      ['Password + confirm', 'min 10 chars', 1, U, 'AspNetUsers.PasswordHash'],\n    ] },\n    { t: 'Step 3 · Documents', c: '#c2410c', note: 'PDF or image, size limit, random stored name.', f: [\n      ['Business license', 'file', 1, U, 'SupplierDocuments (DocType = License)'],\n      ['Tax certificate', 'file + expiry date', 1, U, 'SupplierDocuments (DocType = Tax)'],\n      ['Commercial register', 'file + expiry date', 1, U, 'SupplierDocuments (DocType = CommercialRegister)'],\n      ['Quality certificates (ISO...)', 'file', 0, U, 'SupplierDocuments'],\n      ['Accept terms', 'checkbox', 1, U, 'AuditLogs'],\n    ] },\n    { t: 'Step 4 · Admin verification', c: '#1d4ed8', note: 'The supplier cannot log in until this is done.', f: [\n      ['Status', 'Pending, Approved, Rejected, Suspended', 1, A, 'SupplierProfiles.Status'],\n      ['Reason', 'required for Rejected and Suspended', 0, A, 'SupplierProfiles.StatusReason'],\n      ['Reviewed by / at', 'automatic', 1, S, 'SupplierProfiles.ReviewedByUserId / ReviewedAt'],\n    ] },\n  ];\n\n  // Suppliers do the same biometric steps as employees (fingerprint, face, consent).\n  SUP.push(EMP[3], EMP[4], EMP[5]);\n\n  const by = { Admin: '#1d4ed8', Employee: '#be185d', System: '#475569', Supplier: '#7e22ce' };\n  function build(id, steps) {\n    document.getElementById(id).innerHTML = steps.map((s, i) => `\n      <section class=\"step\" style=\"border-color:${s.c}\">\n        <h2 style=\"color:${s.c}\"><span class=\"num\" style=\"background:${s.c}\">${i + 1}<\/span>${s.t.replace(/^Step \\d · /, '')}<\/h2>\n        ${s.note ? `<p class=\"muted\" style=\"margin:.2rem 0 .8rem;font-size:.9rem\">${s.note}<\/p>` : ''}\n        <table class=\"simple\">\n          <tr><th>Field<\/th><th>Type / example<\/th><th>Required<\/th><th>Filled by<\/th><th>Saved in<\/th><\/tr>\n          ${s.f.map(([a, b, r, w, d]) => `<tr><td><b>${a}<\/b><\/td><td>${b}<\/td>\n            <td>${r ? '<span class=\"req\">Required<\/span>' : '<span class=\"opt\">Optional<\/span>'}<\/td>\n            <td><span class=\"tag\" style=\"background:${by[w]}\">${w}<\/span><\/td><td><code>${d}<\/code><\/td><\/tr>`).join('')}\n        <\/table>\n      <\/section>`).join('');\n  }\n  build('empSteps', EMP); build('supSteps', SUP);\n\n  function tab(which) {\n    document.getElementById('emp').hidden = which !== 'emp';\n    document.getElementById('sup').hidden = which !== 'sup';\n    for (const [id, k] of [['b-emp', 'emp'], ['b-sup', 'sup']]) {\n      const b = document.getElementById(id), on = which === k;\n      b.style.background = on ? '#be185d' : '#fff'; b.style.color = on ? '#fff' : '#0f172a'; b.style.borderColor = on ? '#be185d' : '';\n    }\n  }\n  document.getElementById('b-emp').onclick = () => tab('emp');\n  document.getElementById('b-sup').onclick = () => tab('sup');\n  tab('emp');\n<\/script>\n<\/body>\n<\/html>\n"};
const TITLES = {"index":"Home","schema":"Schema Diagram","er":"ER Diagram","sql":"SQL Script","flow":"Flow Story","pages":"Pages & Roles","onboarding":"Onboarding Data"};
const view = document.getElementById('view');
const nav = document.getElementById('nav');

for (const [id, title] of Object.entries(TITLES)) {
  const a = document.createElement('a');
  a.textContent = title; a.href = '#' + id; a.dataset.id = id;
  nav.appendChild(a);
}

// "#flow/onboarding"  -> page flow, hash onboarding
// "#schema?t=Bids"    -> page schema, search ?t=Bids
function parse() {
  const m = /^#?([a-z]+)(\?[^/]*)?(?:\/(.*))?$/.exec(location.hash) || [];
  const id = PAGES[m[1]] ? m[1] : 'index';
  return { id, search: m[2] || '', hash: m[3] || '' };
}

let current = '';
function show() {
  const { id, search, hash } = parse();
  const key = id + '|' + search + '|' + hash;
  if (key === current) return;
  current = key;
  nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.id === id));
  document.title = TITLES[id] + ' - Sourcing & Tender System';
  const sub = '<script>window.__SUB=' + JSON.stringify({ search, hash: hash ? '#' + hash : '' }).replace(/</g, '\\u003c') + '<\/script>';
  view.srcdoc = PAGES[id].replace('<!--SUB-->', sub);
}

// links inside the pages ("flow.html#big", "schema.html?t=Bids") navigate the shell instead
view.addEventListener('load', () => {
  const doc = view.contentDocument;
  if (!doc) return;
  doc.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    const m = /^([a-z]+)\.html(\?[^#]*)?(?:#(.*))?$/.exec(a.getAttribute('href'));
    if (!m || !PAGES[m[1]]) return;
    e.preventDefault();
    location.hash = '#' + m[1] + (m[2] || '') + (m[3] ? '/' + m[3] : '');
  });
});

window.addEventListener('hashchange', show);
show();
</script>
</body>
</html>
