<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="t d">
<title id="t">MS.WAND — Sourcing &amp; Tender Management System</title>
<desc id="d">A burgundy and champagne emblem with a faceted W medallion, surrounded by glass cards for Purchase Requests, Suppliers, Tenders, Evaluations and Final Decisions, joined by soft glowing lines.</desc>
<defs>
 <radialGradient id="bg" cx="50%" cy="48%" r="78%"><stop offset="0" stop-color="#7A1A35"/><stop offset=".55" stop-color="#5A0E24"/><stop offset="1" stop-color="#26050F"/></radialGradient>
 <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E6D2AE" stop-opacity=".42"/><stop offset=".5" stop-color="#B8777A" stop-opacity=".18"/><stop offset="1" stop-color="#B8777A" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F0E6"/><stop offset=".5" stop-color="#E6D2AE"/><stop offset="1" stop-color="#B8777A"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F0E6" stop-opacity=".20"/><stop offset="1" stop-color="#F6F0E6" stop-opacity=".05"/></linearGradient>
 <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F0E6" stop-opacity=".75"/><stop offset=".5" stop-color="#E6D2AE" stop-opacity=".25"/><stop offset="1" stop-color="#B8777A" stop-opacity=".5"/></linearGradient>
 <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6D2AE" stop-opacity=".55"/><stop offset="1" stop-color="#E6D2AE" stop-opacity="0"/></linearGradient>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="blur24" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
 <clipPath id="hex"><path d="M0 -82 L71 -41 L71 41 L0 82 L-71 41 L-71 -41 Z"/></clipPath>
</defs>
<style>
 .float{animation:float 7s ease-in-out infinite}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
 .p{fill:#E6D2AE;animation:drift 14s ease-in-out infinite,twinkle 5s ease-in-out infinite}
 @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
 @keyframes twinkle{0%,100%{fill-opacity:.35}50%{fill-opacity:1}}
 .flow{stroke-dasharray:3 9;animation:flow 3.2s linear infinite}
 @keyframes flow{to{stroke-dashoffset:-24}}
 .spinY,.spinY2,.tilt,.orbit,.crystal,.halo,.beam,.shine{transform-box:fill-box;transform-origin:center}
 .spinY{animation:spinY 18s ease-in-out infinite}
 .spinY2{animation:spinY 18s ease-in-out -9s infinite}
 @keyframes spinY{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.1)}}
 .tilt{animation:turn 36s linear infinite}
 .orbit{animation:turn 120s linear infinite}
 @keyframes turn{to{transform:rotate(360deg)}}
 .crystal{animation:sway 12s ease-in-out infinite}
 @keyframes sway{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.9)}}
 .halo{animation:halo 7s ease-in-out infinite}
 @keyframes halo{0%,100%{opacity:.6}50%{opacity:1}}
 .beam{animation:beam 9s ease-in-out infinite}
 @keyframes beam{0%,100%{opacity:.5}50%{opacity:1}}
 .shine{animation:shine 7s ease-in-out infinite}
 @keyframes shine{0%{transform:translateX(-170px)}45%,100%{transform:translateX(190px)}}
 @media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
